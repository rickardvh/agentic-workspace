# Portable package facts for any adopted host. Independent of AW source-maintenance policy.
schema_version = 1

[workspace]
main_skill_path = ".agentic-workspace/skills/workspace-startup/SKILL.md"
read_profile_path = ".agentic-workspace/READING.json"
ownership_manifest_path = ".agentic-workspace/OWNERSHIP.toml"
managed_root = ".agentic-workspace/"


[ownership_classes.repo_owned]
summary = "Repository-native state owned by the repo and not upgrade-replaceable by installed packages."

[ownership_classes.managed_fence]
summary = "Product-managed content inside an explicit fence in a repo-owned file."

[ownership_classes.module_managed]
summary = "Upgrade-replaceable content owned by one installed module under .agentic-workspace/."

[[module_roots]]
module = "workspace"
path = ".agentic-workspace/"
ownership = "module_managed"
uninstall_policy = "remove-managed-files-only"

[[module_roots]]
module = "memory"
path = ".agentic-workspace/memory/"
ownership = "repo_owned"
uninstall_policy = "preserve-current-owner-state"

[[module_roots]]
module = "planning"
path = ".agentic-workspace/planning/"
ownership = "repo_owned"
uninstall_policy = "preserve-current-owner-state"

[[managed_surfaces]]
module = "workspace"
path = ".agentic-workspace/skills/workspace-startup/SKILL.md"
kind = "canonical-agent-procedure"
ownership = "module_managed"
uninstall_policy = "remove-if-owned"

[[managed_surfaces]]
module = "workspace"
path = ".agentic-workspace/READING.json"
kind = "generated-read-profile"
ownership = "module_managed"
uninstall_policy = "remove-if-owned"

[[managed_surfaces]]
module = "workspace"
path = ".agentic-workspace/OWNERSHIP.toml"
kind = "ownership-ledger"
ownership = "module_managed"
uninstall_policy = "remove-if-owned"

[[fences]]
name = "workspace-workflow-pointer"
module = "workspace"
file = "AGENTS.md"
start = "<!-- agentic-workspace:workflow:start -->"
end = "<!-- agentic-workspace:workflow:end -->"
ownership = "managed_fence"
uninstall_policy = "remove-fence-only"

[[authority_surfaces]]
concern = "startup-instructions"
read = { refs = ["AGENTS.md", ".agentic-workspace/instructions/"], select = "Read the repository bootstrap and only task-relevant scoped instruction files; their paths/routes and checks/protect/reconcile metadata retain source authority. Local instructions are not repository-visible.", unknown = ["runtime applicability", "local instruction state", "publication admission"] }
surface = "AGENTS.md"
owner = "repo"
ownership = "repo_owned"
authority = "primary"
summary = "Repo-level startup instructions and local operating constraints. The managed AW fence is only a bootstrap pointer to the canonical skill."

[[authority_surfaces]]
concern = "workspace-policy"
read = { refs = [".agentic-workspace/config.toml"], select = "Follow system_intent.sources/preferred_source to repository intent and assurance.decision_record_target to settled decisions; absent intent configuration uses SYSTEM_INTENT.md and README.md. Policy bytes describe requirements, not observed runtime capabilities.", unknown = ["effective local overrides", "live provider capability", "current decision admission"] }
surface = ".agentic-workspace/config.toml"
owner = "repo"
ownership = "repo_owned"
authority = "primary"
summary = "Repo-owned workspace policy, workflow obligations, and structured operating settings."

[[authority_surfaces]]
concern = "bounded-planning-continuity"
read = { refs = [".agentic-workspace/planning/state.toml", ".agentic-workspace/planning/execplans/"], select = "Prefer a task-supplied owner ref; otherwise follow active.execplans.surface in the optional state file or enumerate only immediate *.plan.json names, excluding archive. Select the relevant owner by meaning. Read intent.outcome/non_goals, scope, proof/relationships, blockers, next_action and continuation from that record; recorded status is not fresh proof or local active selection.", unknown = ["local selected owner", "current custody", "task completion"] }
surface = ".agentic-workspace/planning/execplans/"
owner = "planning"
ownership = "module_managed"
authority = "primary"
summary = "Owner-scoped execution continuity owned by the planning package; repository-wide views are derived."

[[authority_surfaces]]
concern = "memory-shared-support"
read = { refs = [".agentic-workspace/memory/repo/manifest.toml"], select = "Use notes metadata (routes_from, semantic_routes and task_relevance) to select relevant note paths; follow only those notes and their stated dependencies. Treat notes as advisory, even if historical metadata says canonical or decision. Stale/superseded/contradicted or changed dependencies require reconsideration.", unknown = ["factual freshness", "governing decision authority", "promotion admission"] }
surface = ".agentic-workspace/memory/"
owner = "memory"
ownership = "module_managed"
authority = "primary"
summary = "Memory-owned shared workflow, version, bootstrap, and skill support surfaces."

[[authority_surfaces]]
concern = "verification-manifest"
read = { refs = [".agentic-workspace/verification/manifest.toml"], select = "Read relevant requirements, protocol/source refs and proof/claim limits. Follow exact evidence refs only when needed. An asserted check, receipt or accepted progress is repository-recorded evidence, not a new successful check or permission to approve/close.", unknown = ["current proof selection", "fresh check success", "claim/effect authority"] }
surface = ".agentic-workspace/verification/manifest.toml"
owner = "verification"
ownership = "repo_owned"
authority = "primary"
summary = "Repo-owned Verification protocol manifest for reusable proof routes, scenarios, and known evidence gaps."
