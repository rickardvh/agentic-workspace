[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-workspace"
version = "0.51.0"
description = "Repo-native continuity and execution layer for agents, combining workspace routing, active planning, and durable memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "developer-tools", "memory", "planning", "repository", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
authors = [
  { name = "Rickard von Haugwitz" },
]
maintainers = [
  { name = "Rickard von Haugwitz" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rickardvh/agentic-workspace"
Repository = "https://github.com/rickardvh/agentic-workspace"
Issues = "https://github.com/rickardvh/agentic-workspace/issues"
Support = "https://github.com/rickardvh/agentic-workspace/issues"
Documentation = "https://github.com/rickardvh/agentic-workspace/blob/master/docs/agentic-workspace-install.md"

[project.scripts]
agentic-workspace = "agentic_workspace.cli:main"

[dependency-groups]
dev = [
  "agentic-workspace-memory",
  "agentic-workspace-planning",
  "agentic-workspace-verification",
  "command-generation @ git+https://github.com/rickardvh/command-generation.git@ac1b9c00bf41352010929de196e7d45e20014615",
  "jsonschema",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "ty",
  "pymarkdownlnt",
]

[tool.uv]
package = true

[tool.uv.sources]
agentic-workspace-memory = { workspace = true }
agentic-workspace-planning = { workspace = true }
agentic-workspace-verification = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/memory",
  "packages/planning",
  "packages/verification",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "src/agentic_workspace/decision.py",
  "src/agentic_workspace/native_core.py",
  "src/agentic_workspace/cli.py",
]
sources = ["src"]
dev-mode-dirs = ["src"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/hatch_build.py",
  "/bindings/python",
  "/bindings/node",
  "/generated/workspace/typescript/package.json",
  "/generated/workspace/typescript/src/native",
  "/scripts/release/stage_native_npm.py",
  "/Cargo.toml",
  "/Cargo.lock",
  "/crates",
  "/README.md",
  "/LICENSE",
  "/src/agentic_workspace/decision.py",
  "/src/agentic_workspace/native_core.py",
  "/src/agentic_workspace/cli.py",
  "/src/agentic_workspace/contracts",
  "/src/agentic_workspace/_payload",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["agentic_workspace"]

[tool.coverage.report]
show_missing = true
skip_covered = true
