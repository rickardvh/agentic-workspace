[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-workspace"
version = "1.3.0"
description = "Persistent operating context and dynamic control for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "developer-tools", "memory", "planning", "repository", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
authors = [
  { name = "Rickard von Haugwitz" },
]
maintainers = [
  { name = "Rickard von Haugwitz" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rickardvh/agentic-workspace"
Repository = "https://github.com/rickardvh/agentic-workspace"
Issues = "https://github.com/rickardvh/agentic-workspace/issues"
Support = "https://github.com/rickardvh/agentic-workspace/issues"
Documentation = "https://github.com/rickardvh/agentic-workspace/blob/master/docs/agentic-workspace-install.md"

[project.scripts]
agentic-workspace = "agentic_workspace.cli:main"

[dependency-groups]
dev = [
  "jsonschema",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "ty",
  "pymarkdownlnt",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = [
  "src/cli/python/agentic_workspace/__init__.py",
  "src/cli/python/agentic_workspace/_binding.py",
  "src/cli/python/agentic_workspace/native_core.py",
  "src/cli/python/agentic_workspace/cli.py",
  "src/adapters/codex/agentic_workspace/codex_provider.py",
  "src/adapters/codex/agentic_workspace/sealed_codex_transport.py",
]
sources = { "src/cli/python" = "", "src/adapters/codex" = "" }
dev-mode-dirs = ["src/cli/python", "src/adapters/codex", "src/tooling/python"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/hatch_build.py",
  "/rust-toolchain.toml",
  "/deny.toml",
  "/src/tooling/check/check_rust_dependencies.py",
  "/src/tooling/release/native_toolchain.py",
  "/.github/release-platforms.json",
  "/src/cli/python/agentic_workspace/__init__.py",
  "/src/cli/python/agentic_workspace/_binding.py",
  "/src/cli/typescript",
  "/src/tooling/release/stage_native_npm.py",
  "/src/tooling/release/coordinated_release.py",
  "/Cargo.toml",
  "/Cargo.lock",
  "/src/core",
  "/src/cli/rust",
  "/README.md",
  "/LICENSE",
  "/src/cli/python/agentic_workspace/native_core.py",
  "/src/cli/python/agentic_workspace/cli.py",
  "/src/adapters/codex/agentic_workspace/codex_provider.py",
  "/src/adapters/codex/agentic_workspace/sealed_codex_transport.py",
  "/src/tooling/contracts",
  "/src/core/payload",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src/cli/python", "src/adapters/codex", "src/tooling/python", "tests"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["agentic_workspace"]

[tool.coverage.report]
show_missing = true
skip_covered = true
