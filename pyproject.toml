[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-workspace"
version = "1.0.0"
description = "A source-first operating decision and typed operation runtime for repository agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rickard von Haugwitz" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["jsonschema>=4.23"]

[project.urls]
Repository = "https://github.com/rickardvh/agentic-workspace"
Issues = "https://github.com/rickardvh/agentic-workspace/issues"

[project.scripts]
agentic-workspace = "agentic_workspace.cli:main"

[project.entry-points."agentic_workspace.modules"]
workspace = "agentic_workspace.builtin_modules:workspace_module"
planning = "agentic_workspace.builtin_modules:planning_module"
memory = "agentic_workspace.builtin_modules:memory_module"
verification = "agentic_workspace.builtin_modules:verification_module"
repository = "agentic_workspace.repository_controls:repository_module"
assignment = "agentic_workspace.orchestration:assignment_module"

[dependency-groups]
dev = ["build", "pytest", "ruff", "ty"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workspace"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/agentic_workspace",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
