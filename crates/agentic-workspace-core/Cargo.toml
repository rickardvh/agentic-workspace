[package]
name = "agentic-workspace-core"
version = "1.0.0-rc.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/rickardvh/agentic-workspace"
homepage = "https://github.com/rickardvh/agentic-workspace"
rust-version = "1.98.1"
description = "Shared deterministic semantic core for Agentic Workspace"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonschema = { version = "0.53", default-features = false }
cap-std = "4.0.3"
toml = "0.8"
toml_edit = "0.22"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
diffy = { version = "0.5.1", default-features = false, features = ["std"] }
inventory = "0.3"
sha1 = "0.10"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "agentic-workspace-core"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
junction = { version = "2.0.0", default-features = false }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
