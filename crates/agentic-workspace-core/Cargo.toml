[package]
name = "agentic-workspace-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared deterministic semantic core for Agentic Workspace"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonschema = { version = "0.53", default-features = false }
cap-std = "4.0.3"
toml = "0.8"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "agentic-workspace-core"
path = "src/main.rs"
