[package]
name = "agentic-workspace-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native command-line adapter for Agentic Workspace"

[dependencies]
serde_json = "1"

[[bin]]
name = "agentic-workspace"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["std", "job-object"] }

[target.'cfg(unix)'.dependencies]
tempfile = "3"
