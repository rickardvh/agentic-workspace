[package]
name = "agentic-workspace-cli"
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rickardvh/agentic-workspace"
homepage = "https://github.com/rickardvh/agentic-workspace"
rust-version = "1.98.1"
description = "Native command-line adapter for Agentic Workspace"

[lints]
workspace = true

[dependencies]
serde_json = "1"

[[bin]]
name = "agentic-workspace"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["std", "job-object"] }

[target.'cfg(unix)'.dependencies]
tempfile = "3"
