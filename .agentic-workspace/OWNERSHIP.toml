schema_version = 1

[[authority_surfaces]]
authority = "primary"
concern = "startup-instructions"
owner = "repo"
ownership = "repo_owned"
summary = "Repo-level startup instructions and local operating constraints. The managed AW fence is only a bootstrap pointer to the canonical skill."
surface = "AGENTS.md"

[authority_surfaces.read]
refs = [
    "AGENTS.md",
    ".agentic-workspace/instructions/",
]
select = "Read the repository bootstrap and only task-relevant scoped instruction files; their paths/routes and checks/protect/reconcile/governed_by metadata retain source authority. Local instructions are not repository-visible."
unknown = [
    "runtime applicability",
    "local instruction state",
    "publication admission",
]

[[authority_surfaces]]
authority = "primary"
concern = "workspace-policy"
owner = "repo"
ownership = "repo_owned"
summary = "Repo-owned workspace policy, workflow obligations, and structured operating settings."
surface = ".agentic-workspace/config.toml"

[authority_surfaces.read]
refs = [".agentic-workspace/config.toml"]
select = "Follow system_intent.sources/preferred_source to repository intent and assurance.decision_record_target to settled decisions; absent intent configuration uses SYSTEM_INTENT.md and README.md. Policy bytes describe requirements, not observed runtime capabilities."
unknown = [
    "effective local overrides",
    "live provider capability",
    "current decision admission",
]

[[authority_surfaces]]
authority = "primary"
concern = "canonical-agent-procedure"
owner = "workspace"
ownership = "module_managed"
summary = "Canonical reusable procedure for agents using Agentic Workspace; it does not own repo policy, domain state/evidence, or effect authority."
surface = ".agentic-workspace/skills/workspace-startup/SKILL.md"

[authority_surfaces.read]
refs = [".agentic-workspace/skills/REGISTRY.json"]
select = "Choose a relevant semantic route with agent judgment; follow only its declared procedure path or registry_sources. An absent optional registry is not an unavailable runtime."
unknown = ["runtime route admission"]

[[authority_surfaces]]
authority = "primary"
concern = "bounded-planning-continuity"
owner = "planning"
ownership = "module_managed"
summary = "Owner-scoped execution continuity owned by the planning package; repository-wide views are derived."
surface = ".agentic-workspace/planning/execplans/"

[authority_surfaces.read]
refs = [
    ".agentic-workspace/planning/state.toml",
    ".agentic-workspace/planning/execplans/",
]
select = "Prefer a task-supplied owner ref; otherwise follow active.execplans.surface in the optional state file or enumerate only immediate *.plan.json names, excluding archive. Select the relevant owner by meaning. Read intent.outcome/non_goals, scope, proof/relationships, blockers, next_action and continuation from that record; recorded status is not fresh proof or local active selection."
unknown = [
    "local selected owner",
    "current custody",
    "task completion",
]

[[authority_surfaces]]
authority = "primary"
concern = "source-maintainer-procedure"
owner = "repo"
ownership = "repo_owned"
summary = "Source-repository maintainer skills; not portable package procedure."
surface = "tools/skills/REGISTRY.json"

[authority_surfaces.read]
refs = ["tools/skills/REGISTRY.json"]
select = "Select the relevant repository-maintainer procedure and follow its declared source; this registry belongs only to this source repository."
unknown = ["runtime route admission"]

[[authority_surfaces]]
authority = "primary"
concern = "design-constraints"
owner = "repo"
ownership = "repo_owned"
summary = "Design tests for product-shape, ownership, and lifecycle changes."
surface = "docs/design-principles.md"

[[authority_surfaces]]
authority = "primary"
concern = "ownership-ledger"
owner = "workspace"
ownership = "module_managed"
summary = "Ownership ledger and static read-only orientation map for managed paths, fences, and authority surfaces."
surface = ".agentic-workspace/OWNERSHIP.toml"

[[authority_surfaces]]
authority = "primary"
concern = "system-intent-mirror"
owner = "workspace"
ownership = "module_managed"
summary = "Workspace-owned mirrored system-intent contract consumed by package operations."
surface = ".agentic-workspace/system-intent/intent.toml"

[[authority_surfaces]]
authority = "candidate"
concern = "agent-aid-candidates"
owner = "repo"
ownership = "repo_owned"
summary = "Optional checked-in candidate area for reusable agent-created aids before promotion to ordinary repo-native surfaces."
surface = ".agentic-workspace/agent-aids/"

[[authority_surfaces]]
authority = "primary"
concern = "planning-install-tree"
owner = "planning"
ownership = "module_managed"
summary = "Planning-owned installed workflow and helper surfaces."
surface = ".agentic-workspace/planning/"

[[authority_surfaces]]
authority = "primary"
concern = "memory-shared-support"
owner = "memory"
ownership = "module_managed"
summary = "Memory-owned shared workflow, version, bootstrap, and skill support surfaces."
surface = ".agentic-workspace/memory/"

[authority_surfaces.read]
refs = [".agentic-workspace/memory/repo/manifest.toml"]
select = "Use notes metadata (routes_from, semantic_routes and task_relevance) to select relevant note paths; follow only those notes and their stated dependencies. Treat notes as advisory, even if historical metadata says canonical or decision. Stale/superseded/contradicted or changed dependencies require reconsideration."
unknown = [
    "factual freshness",
    "governing decision authority",
    "promotion admission",
]

[[authority_surfaces]]
authority = "primary"
concern = "verification-manifest"
owner = "verification"
ownership = "repo_owned"
summary = "Repo-owned Verification protocol manifest for reusable proof routes, scenarios, and known evidence gaps."
surface = ".agentic-workspace/verification/manifest.toml"

[authority_surfaces.read]
refs = [".agentic-workspace/verification/manifest.toml"]
select = "Read relevant requirements, protocol/source refs and proof/claim limits. Follow exact evidence refs only when needed. An asserted check, receipt or accepted progress is repository-recorded evidence, not a new successful check or permission to approve/close."
unknown = [
    "current proof selection",
    "fresh check success",
    "claim/effect authority",
]

[[authority_surfaces]]
authority = "fenced"
concern = "workspace-workflow-pointer"
owner = "workspace"
ownership = "managed_fence"
summary = "Managed mixed-agent bootstrap pointer to the canonical AW skill; not a competing operating procedure."
surface = "AGENTS.md#agentic-workspace:workflow"

[[authority_surfaces]]
authority = "primary"
concern = "verification-current-reconciliation"
owner = "verification"
ownership = "repo_owned"
summary = "Durable current source-reconciliation selection, owned and replaced only by Verification. Repository visibility does not transfer task/target-bound authority; generic cleanup must preserve it."
surface = ".agentic-workspace/proof/current/"

[authority_surfaces.read]
refs = [".agentic-workspace/proof/current/"]
select = "Select only source-reconciliation-<relation>.json for the relevant relation; follow its exact receipt references when needed. Verification validates the bounded projection and receipt custody. Publication supersedes current groups; upgrades, adoption and uninstall preserve this durable owner state and its exact publication temporaries. Missing or corrupt material is unresolved coverage, never authority to reconstruct acceptance from history."
unknown = [
    "current coverage",
    "receipt custody",
    "semantic acceptance",
    "publication authority",
]

