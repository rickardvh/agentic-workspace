[notes]
purpose = "This file defines the workspace ownership ledger, static repository-readable orientation map, and authority boundaries. Installers should converge on this ledger instead of maintaining duplicated managed-path heuristics."

[ownership_classes.managed_fence]
summary = "Product-managed content inside an explicit fence in a repo-owned file."

[ownership_classes.module_managed]
summary = "Upgrade-replaceable content owned by one installed module under .agentic-workspace/."

[ownership_classes.repo_owned]
summary = "Repository-native state owned by the repo and not upgrade-replaceable by installed packages."

[[subsystems]]
does_not_own = [
    "Planning runtime behavior",
    "cross-surface reconciliation policy",
    "durable memory note policy",
]
escalate_when = [
    "change alters Planning runtime or schema",
    "record mutation widens cross-surface authority",
]
id = "planning-records"
owns = [
    "passive execplan record validity",
    "target-integration proposal and receipt guards",
]
paths = [
    ".agentic-workspace/planning/execplans/*.plan.json",
    ".agentic-workspace/planning/integration-proposals/*.integration-proposal.json",
    ".agentic-workspace/planning/integration-receipts/*.integration-receipt.json",
]
proof = [
    "uv run agentic-planning doctor --target . --format json",
    "uv run python scripts/check/check_planning_surfaces.py --format json",
    "uv run pytest packages/planning/tests/test_branch_safe_planning.py -k integration_proposal -q",
]

[[subsystems]]
does_not_own = [
    "durable memory note policy",
    "workspace command runtime internals",
]
escalate_when = [
    "change widens planning state semantics",
    "closeout or archive behavior changes",
]
id = "planning"
owns = [
    "active execution state",
    "execplan scaffolds and closeout",
    "planning package workflow semantics",
]
paths = [
    ".agentic-workspace/planning/state.toml",
    ".agentic-workspace/planning/schemas/**",
    ".agentic-workspace/planning/issue-relations/**",
    ".agentic-workspace/planning/assignments/**",
    ".agentic-workspace/planning/lanes/**",
    ".agentic-workspace/planning/decompositions/**",
    "packages/planning/**",
]
proof = ["make check-planning-nosync"]

[[subsystems]]
does_not_own = [
    "active execution planning",
    "workspace command runtime internals",
]
escalate_when = [
    "change widens what memory may store",
    "promotion policy changes",
]
id = "memory"
owns = [
    "durable repo knowledge",
    "memory note routing",
    "memory package workflow semantics",
]
paths = [
    ".agentic-workspace/memory/**",
    "packages/memory/**",
]
proof = ["make check-memory-nosync"]

[[subsystems]]
does_not_own = [
    "semantic user acceptance",
    "active execution planning",
    "issue or parent-lane closure",
]
escalate_when = [
    "change makes Verification a proof authority",
    "protocol changes widen closeout or acceptance semantics",
]
id = "verification"
owns = [
    "reusable proof protocols",
    "verification evidence routing",
    "verification package workflow semantics",
]
paths = [
    ".agentic-workspace/verification/**",
    "packages/verification/**",
]
proof = ["make check-verification-nosync"]

[[subsystems]]
does_not_own = [
    "planning package state semantics",
    "memory note policy",
    "generated command package source contracts",
]
escalate_when = [
    "change widens public command contract",
    "change requires planning or memory package semantics",
]
id = "workspace-cli-runtime"
owns = [
    "workspace command routing",
    "compact report assembly",
    "runtime adapter dispatch",
    "workspace runtime source boundaries",
]
paths = [
    "generated/workspace/python/**",
    "src/agentic_workspace/workspace_runtime*.py",
]
proof = ["uv run pytest tests/test_workspace_cli.py -q"]

[[subsystems]]
does_not_own = [
    "formal benchmark policy",
    "provider authentication",
    "package runtime command semantics",
]
escalate_when = [
    "scenario changes become formal benchmark policy",
    "provider instability is misclassified as product behavior",
]
id = "model-cli-harness"
owns = [
    "model CLI dogfooding scenarios",
    "adaptive model-run evaluation records",
    "harness scorer guardrails",
]
paths = [
    "tools/model-cli-harness/**",
    "scripts/model_cli_harness/**",
    "tests/test_external_agent_evaluation_lane.py",
]
proof = ["uv run pytest tests/test_external_agent_evaluation_lane.py -q"]

[workspace]
main_skill_path = ".agentic-workspace/skills/workspace-startup/SKILL.md"
managed_root = ".agentic-workspace/"
ownership_manifest_path = ".agentic-workspace/OWNERSHIP.toml"
read_profile_path = ".agentic-workspace/READING.json"
workflow_path = ".agentic-workspace/WORKFLOW.md"
