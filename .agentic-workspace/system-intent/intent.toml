schema_version = 1
kind = "agentic-workspace/system-intent/v1"
summary = "Agentic Workspace should remain a quiet, portable, skills-first repository competence layer: preserve human intent and useful source-owned context, expose only the current decision frontier, make settled consequences directly usable through one Rust authority, and reduce total successful-completion cost without creating a workflow framework or competing source of truth."
governing_intents = ["Preserve only the context that is expensive to rediscover and necessary for safe continuation.", "Keep human-owned why separate from system-shaped what and implementation-level how.", "Make weaker agents safer and spend stronger reasoning on judgment, shaping, review, and recovery rather than orchestration waste.", "Use one canonical operating skill for procedure, repository instructions and configuration for policy, domain owners for current state and evidence, and precise Rust-backed tools for admitted information and effects.", "Surface only what can change the current decision; keep optional computation, transport and detail lazy, and carry settled consequences to exact supported actions without automating semantic judgment.", "Reduce total successful-completion cost across restart, handoff, review, and proof loops.", "Stay quiet, repo-native, low-residue, and sharply bounded in ownership.", "Keep package contracts portable across host repos, languages, agents, vendors, and local dogfooding environments.", "Convert repeated steering, proof confusion, handoff repair, context overload, or late failure into product improvement signals.", "Make correct package-surface construction cheap by design so validation confirms rather than teaches shape.", "Preserve recognized current authority when representations change; transfer or explicitly disposition custody before removal.", "Keep modules as independently owned peer capabilities; retain configuration only when it changes control or demonstrated completion cost.", "Work under partial compliance: binding policy survives optional skill bypass, selected advice stays advisory, and observable future-value learning receives a bounded strongest-owner or no-retention judgment.", "Keep direct and no-signal work quiet; repository-only reading does not establish runtime, mutation, proof, or completion authority.", "Prioritize trustworthy observations by their contribution to an imminent decision and total completion cost; expose bounded answerable questions, preserve legitimate alternatives and required proof, and stop optional investigation when it cannot change the supported decision."]
anti_intents = ["Do not become a visible workflow framework the user must consciously operate.", "Do not grow a surface maze where every good idea becomes another durable file or command.", "Do not optimize one local step while making the overall loop heavier.", "Do not let package-owned and repo-owned artifacts blur into ambiguous authority.", "Do not create a skills runtime, mandatory workflow phase machine, hidden semantic classifier, or universal policy language.", "Do not treat successful validation, matched source records, or a published preview as whole-intent or stable-release acceptance.", "Do not let this repo's current language, tooling, structure, or agent preferences become hidden universal product assumptions.", "Do not treat current local tooling preferences as durable package requirements without explicit justification."]
decision_tests = ["Favor work that preserves human intent more faithfully across time.", "Favor work that makes bounded execution cheaper to start, continue, hand off, review, or finish.", "Favor work that removes, compresses, or backgrounds visible residue instead of adding new first-line surfaces.", "Favor work that sharpens ownership, preserves source-owned policy and currentness-bound interpretations, and makes important operating choices machine-consumable.", "Favor work that improves portability by reducing accidental repo-, language-, agent-, vendor-, or local-tool assumptions.", "Favor work that makes the correct action easy to construct before validation runs.", "Question work that mainly adds framework feel, narrative residue, or new visible concepts without replacing older ones.", "Question work that treats validation success alone as proof that the larger intent was satisfied.", "Question work that relies on repeated validation failures as the authoring interface for package-owned artifacts or workflows."]
open_questions = []
interpretation_notes = "Semantically reconciled on 2026-09-17 against every declared source. SYSTEM_INTENT.md adds qualitative decision-value guidance: upstream observations, bounded human questions, valid evidence reuse, and stopping optional investigation without waiving required work, authority, review or proof. README.md corroborates the skills-first, source-owned operating model and keeps release/support admission separate. Preserve the prior architecture principles and ownership boundaries. No probability scores, ranking engine, uncertainty store or mandatory discovery phase is intended. This interpretation does not establish runtime acceptance or completion of issue #3393."
confidence = "high"
needs_review = false
preferred_source = "SYSTEM_INTENT.md"
last_synced_at = "2026-09-17"

