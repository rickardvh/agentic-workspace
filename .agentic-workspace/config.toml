escalation_conditions = ["cross-owner", "cross-claim-boundary", "focused-route-insufficient", "high-risk-requirement"]
evidence_concepts = ["root-workspace-guidance", "startup-routing", "report-contract", "generated-contract-freshness", "focused-serial-proof"]
notes = "Focused replacement for broad workspace CLI validation on root guidance and diagnostic-intake changes."
owner = "workspace-cli-runtime"
precedence = "65"
proof_profiles = ["workspace_behavior"]
purpose = "Focused root Workspace startup, report, defaults, generated-guidance, and diagnostic-intake behavior."
review_aids = ["Confirm host-target localization, diagnostic intake, maintained proof discovery, output budgets, type posture, and runtime mirror parity remain covered without the broad workspace CLI suite."]
