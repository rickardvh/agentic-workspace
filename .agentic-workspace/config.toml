# Repository-owned Agentic Workspace policy.
# Edit this file directly only when changing repo-owned policy.
# Reference: .agentic-workspace/docs/workspace-config-contract.md
# Resolve through the configured native start route in AGENTS.md.

schema_version = 1

[modules]
enabled = ["planning", "memory", "verification"]

[workspace]
agent_instructions_file = "AGENTS.md"
workflow_artifact_profile = "repo-owned"
improvement_latitude = "proactive"
cli_invoke = "./target/debug/agentic-workspace"

[assurance]
# Repository-owner admission of binding checks/protect in this exact scoped
# instruction snapshot. This grants obligations/restrictions, never proof success.
instruction_revision = "a6ee404328744515ee004d526c0d58980daf517c"
# Source-owner admission of this exact archive snapshot and its provenance.
# Never advance automatically from HEAD or an ordinary client request.
decision_record_target = "docs/decisions"
decision_record_revision = "b4838e325757e523edbdccc51c27a769b8293f43"
default_level = "medium"
agent_may_escalate = true
agent_may_deescalate = false
strict_closeout = true

[payload]
target_release = "source-current"
minimum_capabilities = ["installed-state-sync-v2"]
policy = "required-before-work"

[system_intent]
sources = ["SYSTEM_INTENT.md", "README.md"]
preferred_source = "SYSTEM_INTENT.md"
