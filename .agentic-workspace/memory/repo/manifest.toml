version = 1

[rules]
canonical_dirs = [
  ".agentic-workspace/memory/repo/domains",
  ".agentic-workspace/memory/repo/invariants",
  ".agentic-workspace/memory/repo/runbooks",
  ".agentic-workspace/memory/repo/mistakes",
  ".agentic-workspace/memory/repo/decisions",
]
task_board_globs = ["TODO.md", "tasks/**", ".github/issues/**"]

[notes.".agentic-workspace/memory/repo/index.md"]
note_type = "routing"
canonical_home = ".agentic-workspace/memory/repo/index.md"
task_relevance = "optional"
routes_from = ["AGENTS.md", ".agentic-workspace/memory/repo/**/*.md"]
stale_when = [".agentic-workspace/memory/repo/manifest.toml", ".agentic-workspace/memory/repo/**/*.md"]

[notes.".agentic-workspace/memory/repo/domains/example-runtime-boundary.md"]
note_type = "domain"
canonical_home = ".agentic-workspace/memory/repo/domains/example-runtime-boundary.md"
task_relevance = "optional"
routes_from = ["src/agentic_workspace/**", "generated/**", "scripts/generate/**"]
stale_when = ["src/agentic_workspace/contracts/**", "scripts/generate/**", "generated/**"]

[notes.".agentic-workspace/memory/repo/domains/memory-package-context.md"]
note_type = "domain"
canonical_home = ".agentic-workspace/memory/repo/domains/memory-package-context.md"
task_relevance = "optional"
routes_from = ["packages/memory/**"]
stale_when = ["packages/memory/src/**", "packages/memory/bootstrap/**", "packages/memory/README.md"]

[notes.".agentic-workspace/memory/repo/domains/planning-package-context.md"]
note_type = "domain"
canonical_home = ".agentic-workspace/memory/repo/domains/planning-package-context.md"
task_relevance = "optional"
routes_from = ["packages/planning/**", ".agentic-workspace/planning/**"]
stale_when = ["packages/planning/src/**", "packages/planning/bootstrap/**", "packages/planning/README.md"]

[notes.".agentic-workspace/memory/repo/decisions/installed-system-consolidation-2026-04-05.md"]
note_type = "decision"
canonical_home = ".agentic-workspace/memory/repo/decisions/installed-system-consolidation-2026-04-05.md"
task_relevance = "optional"
routes_from = [".agentic-workspace/**", "packages/memory/**", "packages/planning/**"]
stale_when = [".agentic-workspace/config.toml", "src/agentic_workspace/contracts/module_registry.json", "packages/*/pyproject.toml"]
disposition = { note_revision = "sha256:06332182cc9f0085b4c0d6d2bdf132ff607c8eb339b1c403f3700ac9031100fa", reason = "The human determined that this note is no longer necessary as a memory note. Retire it from active Memory selection; preserve the source text without promoting or confirming its historical claims.", status = "retire" }

[notes.".agentic-workspace/memory/repo/mistakes/recurring-failures.md"]
note_type = "recurring-failures"
canonical_home = ".agentic-workspace/memory/repo/mistakes/recurring-failures.md"
task_relevance = "optional"
semantic_routes = ["github/pr/review"]
routes_from = ["src/agentic_workspace/workspace_runtime_*.py", ".agentic-workspace/planning/**"]
stale_when = ["src/agentic_workspace/workspace_runtime_planning.py", "src/agentic_workspace/workspace_runtime_startup.py"]

[durable_facts."selected-plan-owned-next-task"]
summary = "When current work belongs to the selected Planning owner, rebind from that owner and task; preserve older closeout residue separately instead of classifying the owned task as unrelated."
owner = "planning-route-decision"
evidence = [".agentic-workspace/memory/repo/mistakes/recurring-failures.md", "src/agentic_workspace/workspace_runtime_planning.py"]
authority_class = "advisory"
note_ref = ".agentic-workspace/memory/repo/mistakes/recurring-failures.md#failure-selected-plan-blocks-its-next-owned-task"
promotion = "Promote when the route classifier can mechanically preserve the owner/task relation."
demotion_or_expiry = "Retire after the stronger Planning owner prevents the recurrence and regression proof remains stable. After admitted promotion, retain only a stub."
promotion_target = "planning-route-decision / issue #2566 or successor"
promotion_trigger = "The same owner/task relation is classified independent-pending-scope after this fact was projected."
preferred_remediation = "Make the structured Planning route classifier preserve selected-owner task relations."
elimination_target = "selected plan blocks its next owned task"
