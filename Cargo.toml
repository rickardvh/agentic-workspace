[workspace]
members = ["src/core", "src/cli/rust"]
resolver = "2"

[workspace.metadata]
# Source compatibility is the pinned compiler, not an untested lower MSRV.
source-build-toolchain = "rust-toolchain.toml"

[workspace.lints.rust]
unsafe_code = "forbid"

# Native proof repeatedly fingerprints complete executables. Keep that exact
# observation affordable with debug symbols, including in the inherited test profile.
[profile.dev.package.sha2]
opt-level = 3
