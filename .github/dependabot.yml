version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      immutable-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /bindings/node
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /generated/memory/typescript
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /generated/planning/typescript
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /generated/verification/typescript
    schedule:
      interval: weekly
