name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact generated release or explicitly escalated head that must receive exhaustive validation.
        required: true
        type: string
      reason:
        description: Why exhaustive proof is required for this exact head.
        required: true
        type: string

permissions:
  contents: read

jobs:
  merge-sufficiency:
    name: Merge sufficiency
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Admit Rust stable core toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify frozen dependency graph
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Run universal static merge checks
        run: |
          cargo +stable check --locked --workspace --all-targets
          cargo +stable fmt --all -- --check
          make lint-workspace
          make typecheck-nosync
      - name: Run compact public integration guard
        run: |
          uv run pytest \
            tests/test_native_public_cli.py::test_public_read_real_repository_decision_preserves_currentness \
            tests/test_native_public_cli.py::test_current_public_route_survives_fresh_process_but_not_source_change \
            tests/test_native_public_cli.py::test_real_instruction_protection_and_source_drift \
            -q
          uv run pytest tests/test_native_source_reconciliation.py \
            -k "source_judgment_rejects_forged_labels_and_missing_sources or new_instruction_source_invalidates_absent_obligation" \
            -q
          uv run pytest tests/test_native_operating_carriage.py \
            -k "exact_answer_and_action_carriage_preserve_full_effects and native" \
            -q
          uv run pytest tests/test_native_invoke_continuation.py \
            -k "invoke_returns_current_projection_without_another_entry and native" \
            -q
          uv run pytest tests/test_native_independent_owner.py \
            -k "independent_native_owner_discovery_request_action_result and json" \
            -q
      - name: Verify bounded route registries and Unix confinement
        run: |
          cargo +stable test --locked -p agentic-workspace-core native_routes::
          uv run pytest tests/test_native_former_routes.py -q
      - name: Verify skills-first interface convergence
        run: |
          uv run python scripts/generate/generate_agent_interface.py --check
          uv run pytest tests/test_skills_first_interface.py -q
      - name: Verify Priority 3 currentness and task resource lifecycle
        run: |
          cargo +stable test --locked -p agentic-workspace-core schema_reuse_tests
          uv run pytest tests/test_priority3_resources.py tests/test_priority4_control.py -q
          uv run pytest tests/test_preview_release.py -k "not built_preview_root_urls" -q
      - name: Preserve representative Planning custody
        run: >-
          uv run pytest tests/test_native_planning_create.py
          -k "public_creation_then_separate_selection"
          -q
      - name: Verify merge-versus-release stage policy
        run: >-
          uv run pytest
          tests/test_release_workflows.py::test_master_release_workflow_prepares_release_pr_and_only_tags_verified_release_commit
          tests/test_release_workflows.py::test_ci_pr_path_is_merge_sufficiency_not_release_admission
          tests/test_release_workflows.py::test_master_ruleset_and_release_policy_require_merge_sufficiency_before_support_proof
          tests/test_release_workflows.py::test_ci_supports_exact_head_dispatch_for_generated_release_prs
          tests/test_ci_exhaustive_admission.py
          tests/test_support_bearing_promotion.py::test_checked_in_master_ruleset_requires_review_and_merge_sufficiency
          tests/test_workspace_packaging.py::test_ci_retains_root_package_artifacts_for_explicit_exhaustive_dispatch
          -q

  # Refuse stale or reasonless exhaustive dispatches before any broad proof
  # runner is eligible to allocate. The aggregate may still report a failed
  # dispatch, but the release-sized fan-out remains behind this one tiny gate.
  exhaustive-admission:
    name: Exhaustive admission
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify dispatched release head
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_SHA}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "Dispatched CI resolved ${GITHUB_SHA}, expected ${EXPECTED_HEAD_SHA}" >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "${REASON}" | tr -d '[:space:]')" ]; then
            echo "Exhaustive CI dispatch requires a non-empty reason" >&2
            exit 1
          fi
          echo "Admitted exhaustive proof for ${GITHUB_SHA}: ${REASON}"

  # Exhaustive candidate proof is explicit rather than ambient. The generated
  # release path dispatches this workflow against the exact release head, and a
  # high-risk PR may do the same when its own claim requires broader evidence.
  # Ordinary PRs and master merges do not pay release-sized proof automatically.
  workspace-checks:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Admit Rust stable core toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Run native root CLI and thin-launcher admission
        run: uv run pytest tests/test_native_public_cli.py::test_public_read_real_repository_decision_preserves_currentness tests/test_native_public_cli.py::test_current_public_route_survives_fresh_process_but_not_source_change tests/test_native_public_cli.py::test_real_instruction_protection_and_source_drift -q
      - name: Run routed workspace CLI and proof contracts
        run: uv run pytest tests/test_workspace_cli.py tests/test_workspace_proof_generated_packages_cli.py -q
      - name: Preserve real Planning custody through public consumers
        run: >-
          uv run pytest tests/test_native_public_cli.py tests/test_native_planning_create.py
          -k "real_former or requirements_preserve_planning or unrelated_claim_request_keeps_planning or public_creation_then_separate_selection or quiescent_selected_owner"
          -q
      - name: Admit exact current source reconciliation through public consumers
        run: uv run pytest tests/test_native_source_reconciliation.py -q
      - name: Prove compact operating projection and exact carriage
        run: uv run pytest tests/test_native_operating_carriage.py tests/test_native_invoke_continuation.py -q
      - name: Preserve stronger and fallback decision ownership through public consumers
        run: uv run pytest tests/test_native_repository_decisions.py tests/test_native_memory_capture.py -q
      - name: Run shared operating-decision core proof
        run: |
          cargo +stable build --locked --workspace --bins
          cargo +stable test --workspace
          uv run pytest tests/test_shared_core.py tests/test_v1_contract.py -q
      - name: Run workspace lint
        run: make lint-workspace
      - name: Run workspace typecheck without another sync
        run: make typecheck-nosync
      - name: Run workspace release proof
        run: make verify-workspace
      - name: Verify generated command packages
        run: uv run python scripts/check/check_generated_command_packages.py --conformance-shard --require-node

  planning-handoff-checks:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Admit Rust stable core toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Preserve Planning handoff continuation through public consumers
        run: uv run pytest tests/test_native_readonly_handoff.py tests/test_native_delegation_lifecycle.py -vv -o faulthandler_timeout=120

  independent-owner-ingress:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Admit Rust stable core toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Prove independently linked native owner admission through public consumers
        run: uv run pytest tests/test_native_independent_owner.py -vv -o faulthandler_timeout=120

  workspace-package-artifacts:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify lock
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Build coordinated artifacts
        run: |
          uv build --wheel --sdist --out-dir dist
          uv build --wheel --sdist --out-dir dist packages/memory
          uv build --wheel --sdist --out-dir dist packages/planning
          uv build --wheel --sdist --out-dir dist packages/verification
      - name: Run built package and external-consumer proof
        run: |
          uv run pytest tests/test_workspace_packaging.py::test_installed_workspace_wheel_imports_cli_module tests/test_workspace_packaging.py::test_installed_workspace_stack_runs_fresh_repo_cli_sequence tests/test_workspace_packaging.py::test_release_root_wheel_installs_workspace_stack_from_same_release_assets -q
          uv run python scripts/check/run_external_consumer_readiness.py --dist-dir dist --require-node
      - name: Prove exact npm artifacts
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-ci.json PACKED_ARTIFACT_CONTEXT=hosted-ci
      - name: Upload coordinated package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-workspace-package-artifacts
          path: dist/*
          if-no-files-found: error

  package-checks:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: memory
            distribution: agentic-workspace-memory
          - package: planning
            distribution: agentic-workspace-planning
          - package: verification
            distribution: agentic-workspace-verification
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify lock
        run: uv lock --check
      - name: Sync the package once
        run: make sync-${{ matrix.package }}
      - name: Run package checks
        run: make check-${{ matrix.package }}-nosync

  declared-runtime-matrix:
    needs: exhaustive-admission
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "20"
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: ubuntu-latest
            python: "3.14"
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Admit Rust stable core toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Verify frozen dependency graph
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Prove path, subprocess, install, and semantic behavior
        run: |
          cargo +stable build --locked --workspace --bins
          cargo +stable test --workspace
          uv run pytest tests/test_shared_core.py tests/test_v1_contract.py -q
          uv run pytest tests/test_external_integration_boundary.py tests/test_package_identity.py::test_install_survives_into_fresh_second_process -q
          uv run pytest tests/test_native_maintainer_logging.py::test_native_logging_concurrent_append_preserves_valid_sequence tests/test_native_maintainer_logging.py::test_native_logging_concurrent_registration_preserves_existing_identities -q
          uv run python scripts/check/check_generated_command_packages.py --conformance-shard --require-node

  support-bearing-promotion:
    name: Support-bearing promotion
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [workspace-checks, planning-handoff-checks, independent-owner-ingress, workspace-package-artifacts, package-checks, declared-runtime-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every support-bearing candidate check
        env:
          WORKSPACE_CHECKS: ${{ needs.workspace-checks.result }}
          PLANNING_HANDOFF: ${{ needs.planning-handoff-checks.result }}
          INDEPENDENT_OWNER: ${{ needs.independent-owner-ingress.result }}
          PACKAGE_ARTIFACTS: ${{ needs.workspace-package-artifacts.result }}
          PACKAGE_CHECKS: ${{ needs.package-checks.result }}
          RUNTIME_MATRIX: ${{ needs.declared-runtime-matrix.result }}
        run: |
          python - <<'PY'
          import os
          results = {name: os.environ[name] for name in ("WORKSPACE_CHECKS", "PLANNING_HANDOFF", "INDEPENDENT_OWNER", "PACKAGE_ARTIFACTS", "PACKAGE_CHECKS", "RUNTIME_MATRIX")}
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"support-bearing promotion checks failed: {failed}")
          print("support-bearing promotion checks passed")
          PY
