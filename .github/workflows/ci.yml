name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --all-groups
      - run: make check
      - run: make build

  release-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --all-groups
      - run: make release-check

  support-bearing-promotion:
    name: Support-bearing promotion
    if: ${{ always() }}
    needs: [check, release-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every retained v1 check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RELEASE_ADMISSION_RESULT: ${{ needs.release-admission.result }}
        run: |
          if [ "$CHECK_RESULT" != "success" ] || [ "$RELEASE_ADMISSION_RESULT" != "success" ]; then
            echo "Support-bearing checks failed: check=$CHECK_RESULT release-admission=$RELEASE_ADMISSION_RESULT"
            exit 1
          fi
          echo "Support-bearing promotion checks passed"
