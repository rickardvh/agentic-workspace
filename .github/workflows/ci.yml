name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  workspace-checks:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Sync workspace dependencies
        run: make sync-all

      - name: Run root generated CLI smoke tests
        run: uv run pytest tests/test_generated_tool_conformance.py::test_generated_tool_process_conformance_contracts[modules.report.process] tests/test_generated_tool_conformance.py::test_generated_tool_process_conformance_contracts[defaults.root-cli-authority.process] -q

      - name: Run startup CLI contract tests
        run: uv run pytest tests/test_workspace_cli.py tests/test_workspace_proof_generated_packages_cli.py -q

      - name: Run workspace lint
        run: make lint-workspace

      - name: Run typecheck
        run: make typecheck-nosync

      - name: Verify root generated CLI
        run: make verify-workspace

      - name: Check generated command packages and representative semantics
        run: uv run python scripts/check/check_generated_command_packages.py --conformance-shard --require-node

  workspace-package-artifacts:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Sync workspace dependencies
        run: make sync-all

      - name: Build Agentic Workspace package artifacts
        run: |
          uv build --wheel --sdist --out-dir dist
          uv build --wheel --sdist --out-dir dist packages/memory
          uv build --wheel --sdist --out-dir dist packages/planning
          uv build --wheel --sdist --out-dir dist packages/verification

      - name: Run built package smoke tests
        run: uv run pytest tests/test_workspace_packaging.py::test_installed_workspace_wheel_imports_cli_module tests/test_workspace_packaging.py::test_installed_workspace_stack_runs_fresh_repo_cli_sequence tests/test_workspace_packaging.py::test_release_root_wheel_installs_workspace_stack_from_same_release_assets -q

      - name: Prove independent external-consumer readiness
        run: uv run python scripts/check/run_external_consumer_readiness.py --dist-dir dist --require-node

      - name: Upload Agentic Workspace package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-workspace-package-artifacts
          path: dist/*
          if-no-files-found: error

  package-checks:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [memory, planning, verification]
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync package-scoped dependencies
        run: make sync-${{ matrix.package }}

      - name: Run package checks
        run: make check-${{ matrix.package }}-nosync

  declared-runtime-matrix:
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    name: Runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "20"
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: windows-latest
            python: "3.14"
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Verify frozen dependency graph
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Prove path, subprocess, install, and semantic behavior
        run: |
          uv run pytest tests/test_workspace_packaging.py::test_installed_workspace_stack_runs_fresh_repo_cli_sequence -q
          node --test generated/workspace/typescript/test/command-package.test.mjs

  support-bearing-promotion:
    name: Support-bearing promotion
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.draft == false) }}
    needs: [workspace-checks, workspace-package-artifacts, package-checks, declared-runtime-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every support-bearing PR check
        env:
          WORKSPACE_CHECKS: ${{ needs.workspace-checks.result }}
          PACKAGE_ARTIFACTS: ${{ needs.workspace-package-artifacts.result }}
          PACKAGE_CHECKS: ${{ needs.package-checks.result }}
          RUNTIME_MATRIX: ${{ needs.declared-runtime-matrix.result }}
        run: |
          python - <<'PY'
          import os
          results = {name: os.environ[name] for name in ("WORKSPACE_CHECKS", "PACKAGE_ARTIFACTS", "PACKAGE_CHECKS", "RUNTIME_MATRIX")}
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"support-bearing promotion checks failed: {failed}")
          print("support-bearing promotion checks passed")
          PY
