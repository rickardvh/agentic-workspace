name: Release

on:
  push:
    tags: ["v1.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups
      - run: make check
      - run: uv build --wheel --sdist
      - uses: pypa/gh-action-pypi-publish@release/v1
