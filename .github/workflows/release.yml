name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish.
        required: true
        type: string
      source_commit:
        description: Commit the tag must resolve to.
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  promotion-admission:
    name: Verify exact protected commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || '' }}
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Resolve and verify exact source commit checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          if [ -n "${EXPECTED_SOURCE_COMMIT}" ] && [ "${RELEASE_COMMIT}" != "${EXPECTED_SOURCE_COMMIT}" ]; then
            echo "Release subject ${RELEASE_COMMIT} does not match ${EXPECTED_SOURCE_COMMIT}" >&2
            exit 1
          fi
          python scripts/release/support_bearing_promotion.py github-checks \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --output server-promotion-receipt.json \
            --wait-seconds 900
      - name: Upload server promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-promotion-receipt
          path: server-promotion-receipt.json
          if-no-files-found: error

  release-runtime-matrix:
    name: Release runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "20"
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: windows-latest
            python: "3.14"
            node: "24"
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify lock and runtime-specific behavior
        run: |
          uv lock --check
          uv sync --locked --all-groups
          uv run pytest tests/test_external_integration_boundary.py tests/test_package_identity.py::test_install_survives_into_fresh_second_process -q
          uv run python scripts/check/check_generated_command_packages.py --conformance-shard --require-node
      - name: Write runtime support receipt
        shell: bash
        run: |
          mkdir -p runtime-receipts
          python scripts/release/support_bearing_promotion.py runtime-receipt \
            --commit "$(git rev-parse HEAD)" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --node "${{ matrix.node }}" \
            --proof "runtime-specific path, subprocess, install, and generated semantic behavior" \
            --output "runtime-receipts/${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}.json"
      - name: Upload runtime support receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: runtime-receipts/*.json
          if-no-files-found: error

  agentic-workspace-package:
    needs: [promotion-admission, release-runtime-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download exact-commit promotion receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-promotion-receipt
          path: promotion-inputs/server

      - name: Download declared runtime receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: promotion-inputs/runtime
          merge-multiple: true

      - name: Sync workspace dependencies
        run: uv sync --locked --all-groups

      - name: Verify tag targets coordinated release commit
        run: |
          git fetch origin "refs/heads/master:refs/remotes/origin/master" --tags
          TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${TAG_COMMIT}, but checkout is ${HEAD_COMMIT}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_SOURCE_COMMIT}" ] && [ "$TAG_COMMIT" != "${EXPECTED_SOURCE_COMMIT}" ]; then
            echo "Release tag ${RELEASE_TAG} resolves to ${TAG_COMMIT}, expected ${EXPECTED_SOURCE_COMMIT}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_COMMIT" origin/master; then
            echo "Release tag ${RELEASE_TAG} must point at a commit reachable from origin/master" >&2
            exit 1
          fi
          python scripts/release/coordinated_release.py verify --tag "${RELEASE_TAG}"
          python - <<'PY'
          import json
          from pathlib import Path

          ownership = json.loads(Path(".github/release-ownership.json").read_text(encoding="utf-8"))
          for package in ownership["typescript_packages"]:
              payload = json.loads(Path(package["package_json"]).read_text(encoding="utf-8"))
              if payload.get("private") is not True or package.get("release_policy") != "release-asset-only":
                  raise SystemExit(f"{package['package_json']} must be explicitly unpublished and release-asset-only")
          PY

      - name: Build Agentic Workspace package artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          uv build --wheel --sdist --out-dir dist
          uv build --wheel --sdist --out-dir dist packages/memory
          uv build --wheel --sdist --out-dir dist packages/planning
          uv build --wheel --sdist --out-dir dist packages/verification
          python scripts/release/patch_workspace_release_wheel.py \
            --dist-dir dist \
            --version "${RELEASE_TAG#v}" \
            --release-asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for package in generated/*/typescript; do
            (cd "$package" && npm test && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          done
          uv run python scripts/check/check_package_identity.py \
            --artifact-dir dist \
            --require-exact-urls \
            --write-receipts

      - name: Run built package smoke tests
        run: uv run pytest tests/test_workspace_packaging.py::test_installed_workspace_wheel_imports_cli_module tests/test_workspace_packaging.py::test_installed_workspace_stack_runs_fresh_repo_cli_sequence tests/test_workspace_packaging.py::test_release_root_wheel_installs_workspace_stack_from_same_release_assets -q

      - name: Generate release SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: dist
          format: spdx-json
          output-file: dist/agentic-workspace.spdx.json
          upload-artifact: false

      - name: Prove exact npm artifacts on Node 24
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node24.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Set up minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Prove exact npm artifacts on Node 20
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node20.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Set up current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - name: Prove exact npm artifacts on Node 25
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node25.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Verify semantic-conformance promotion receipts
        run: |
          for runtime_major in 20 24 25; do
            receipt="dist/generated-command-conformance-node${runtime_major}.json"
            uv run python scripts/check/run_generated_command_package_proof.py --verify-receipt "$receipt" --artifact-dir dist --expected-node-major "$runtime_major" --expected-execution-context hosted-ci
          done

      - name: Generate checksums and release manifest
        env:
          SECURITY_READINESS_COMMAND: uv run python scripts/check/check_security_supply_chain.py --format json --source-identity ${{ github.sha }} --artifact-dir dist --output dist/security-supply-chain-readiness.json
        run: |
          $SECURITY_READINESS_COMMAND
          python scripts/release/support_bearing_promotion.py compose \
            --commit "$(git rev-parse HEAD)" \
            --artifact-dir dist \
            --server-receipt promotion-inputs/server/server-promotion-receipt.json \
            --runtime-receipt-dir promotion-inputs/runtime \
            --semantic-receipt dist/generated-command-conformance-node20.json \
            --semantic-receipt dist/generated-command-conformance-node24.json \
            --semantic-receipt dist/generated-command-conformance-node25.json \
            --output dist/support-bearing-promotion.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          ownership = json.loads(Path(".github/release-ownership.json").read_text(encoding="utf-8"))
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          root_pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          command_generation_dependency = ""
          for dependency in root_pyproject.get("dependency-groups", {}).get("dev", []):
              if str(dependency).startswith("command-generation @ "):
                  command_generation_dependency = str(dependency)
                  break
          match = re.search(r"command_generation-(?P<version>[0-9][^-/]*)-py3-none-any\\.whl", command_generation_dependency)
          command_generation_version = match.group("version") if match else ""

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          dist = Path("dist")
          checksum_lines = []
          package_entries = []
          for package in ownership["packages"]:
              declared = tomllib.loads(Path(package["pyproject"]).read_text(encoding="utf-8"))["project"]["version"]
              if declared != version:
                  raise SystemExit(f"{package['pyproject']} has version {declared}, expected {version}")
              wheel = next(dist.glob(f"{package['wheel_prefix']}-{version}-*.whl"), None)
              sdist = next(dist.glob(f"{package['sdist_prefix']}-{version}.tar.gz"), None)
              if wheel is None or sdist is None:
                  raise SystemExit(f"Missing wheel or sdist for {package['name']} {version}")
              for artifact in (wheel, sdist):
                  checksum_lines.append(f"{sha256(artifact)}  {artifact.name}")
              package_entries.append(
                  {
                      "name": package["name"],
                      "ecosystem": "python",
                      "version": version,
                      "pyproject": package["pyproject"],
                      "wheel": {"asset": wheel.name, "sha256": sha256(wheel)},
                      "sdist": {"asset": sdist.name, "sha256": sha256(sdist)},
                      "payload_schema": package["payload_schema"],
                      "payload_provenance": package["payload_provenance"],
                      "generated_command_contract": package["generated_command_contract"],
                      "license_spdx": ownership["project_identity"]["license_spdx"],
                  }
              )
          for package in ownership["typescript_packages"]:
              package_json = json.loads(Path(package["package_json"]).read_text(encoding="utf-8"))
              declared = package_json["version"]
              if declared != version:
                  raise SystemExit(f"{package['package_json']} has version {declared}, expected {version}")
              if package_json.get("private") is not True or package.get("release_policy") != "release-asset-only":
                  raise SystemExit(f"{package['package_json']} must be explicitly unpublished and release-asset-only")
              tarball = next(dist.glob(f"{package['tarball_prefix']}-{version}.tgz"), None)
              if tarball is None:
                  raise SystemExit(f"Missing npm tarball for {package['name']} {version}")
              checksum_lines.append(f"{sha256(tarball)}  {tarball.name}")
              package_entries.append(
                  {
                      "name": package["name"],
                      "ecosystem": "npm",
                      "version": version,
                      "package_json": package["package_json"],
                      "package_root": package["package_root"],
                      "tarball": {"asset": tarball.name, "sha256": sha256(tarball)},
                      "entrypoints": package["entrypoints"],
                      "python_package": package["python_package"],
                      "runtime": package["runtime"],
                      "runtime_requirement": package["runtime_requirement"],
                      "release_policy": package["release_policy"],
                      "registry_status": package["registry_status"],
                      "generated_command_contract": package["generated_command_contract"],
                      "license_spdx": ownership["project_identity"]["license_spdx"],
                  }
              )

          conformance_receipts = []
          expected_runtime_majors = ownership["semantic_conformance"]["runtime_majors"]
          for runtime_major in expected_runtime_majors:
              receipt_path = dist / f"generated-command-conformance-node{runtime_major}.json"
              if not receipt_path.is_file():
                  raise SystemExit(f"Missing semantic-conformance receipt for Node {runtime_major}")
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              if receipt.get("kind") != ownership["semantic_conformance"]["receipt_kind"] or receipt.get("status") != "passed":
                  raise SystemExit(f"Failed or unsupported semantic-conformance receipt: {receipt_path}")
              node_version = str(receipt.get("subject", {}).get("node_version", ""))
              runtime_match = re.fullmatch(r"v(?P<major>[1-9][0-9]*)\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", node_version)
              if runtime_match is None or int(runtime_match.group("major")) != runtime_major:
                  raise SystemExit(
                      f"Semantic-conformance receipt runtime mismatch: {receipt_path} proves {node_version!r}, expected Node {runtime_major}"
                  )
              receipt_assets = {item["asset"] for item in receipt["subject"]["artifacts"]}
              expected_assets = {entry["tarball"]["asset"] for entry in package_entries if entry["ecosystem"] == "npm"}
              if receipt_assets != expected_assets:
                  raise SystemExit(f"Semantic-conformance receipt artifact set mismatch: {receipt_path}")
              checksum_lines.append(f"{sha256(receipt_path)}  {receipt_path.name}")
              conformance_receipts.append(
                  {
                      "asset": receipt_path.name,
                      "receipt_id": receipt["receipt_id"],
                      "registry_fingerprint": receipt["subject"]["registry_fingerprint"],
                      "node_version": receipt["subject"]["node_version"],
                      "artifacts": receipt["subject"]["artifacts"],
                  }
              )

          manifest = {
              "kind": "agentic-workspace/coordinated-release-manifest/v1",
              "release_model": ownership["release_model"],
              "version": version,
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
              "all_or_nothing": True,
              "project_identity": ownership["project_identity"],
              "distribution_identity": ownership["distribution_identity"],
              "packages": package_entries,
              "command_generation": {
                  "dependency": command_generation_dependency,
                  "version": command_generation_version,
                  "runtime_required": False,
              },
              "release_ownership": {
                  "path": ".github/release-ownership.json",
                  "schema_version": ownership["schema_version"],
              },
              "distribution_install_readiness": ownership["distribution_identity"]["canonical_install_receipt"],
              "redistributable_package_readiness": ownership["distribution_identity"]["redistributable_receipt"],
              "semantic_conformance": {
                  "required": True,
                  "receipt_kind": ownership["semantic_conformance"]["receipt_kind"],
                  "receipts": conformance_receipts,
              },
              "security_supply_chain": {
                  "required": True,
                  "readiness_receipt": "security-supply-chain-readiness.json",
                  "sbom": "agentic-workspace.spdx.json",
                  "provenance": "GitHub artifact attestation over dist/*",
              },
              "support_bearing_promotion": {
                  "required": True,
                  "receipt": "support-bearing-promotion.json",
                  "source_commit": subprocess.run(
                      ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True
                  ).stdout.strip(),
              },
          }
          manifest_path = dist / "agentic-workspace-release-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for required_security_asset in ("security-supply-chain-readiness.json", "agentic-workspace.spdx.json"):
              security_path = dist / required_security_asset
              if not security_path.is_file():
                  raise SystemExit(f"Missing required security supply-chain asset: {required_security_asset}")
              checksum_lines.append(f"{sha256(security_path)}  {security_path.name}")
          for readiness_asset in (
              ownership["distribution_identity"]["canonical_install_receipt"],
              ownership["distribution_identity"]["redistributable_receipt"],
          ):
              readiness_path = dist / readiness_asset
              if not readiness_path.is_file():
                  raise SystemExit(f"Missing package readiness asset: {readiness_asset}")
              checksum_lines.append(f"{sha256(readiness_path)}  {readiness_path.name}")
          promotion_path = dist / "support-bearing-promotion.json"
          promotion = json.loads(promotion_path.read_text(encoding="utf-8")) if promotion_path.is_file() else {}
          if promotion.get("status") != "passed" or promotion.get("source_commit") != manifest["source_commit"]:
              raise SystemExit("Missing or invalid exact-subject support-bearing promotion result")
          checksum_lines.append(f"{sha256(promotion_path)}  {promotion_path.name}")
          checksum_lines.append(f"{sha256(manifest_path)}  {manifest_path.name}")
          (dist / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          PY

      - name: Verify release artifacts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          dist = Path("dist")
          manifest = json.loads((dist / "agentic-workspace-release-manifest.json").read_text(encoding="utf-8"))
          if manifest["tag"] != os.environ["RELEASE_TAG"]:
              raise SystemExit("Release manifest tag mismatch")
          source_commit = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if manifest.get("source_commit") != source_commit:
              raise SystemExit("Release manifest source_commit mismatch")
          ownership = json.loads(Path(".github/release-ownership.json").read_text(encoding="utf-8"))
          expected_package_count = len(ownership["packages"]) + len(ownership["typescript_packages"])
          if len(manifest["packages"]) != expected_package_count:
              raise SystemExit("Release manifest must list every shipped package")
          checksums = {}
          for line in (dist / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, asset = line.split("  ", 1)
              checksums[asset] = digest
          required_assets = {
              "agentic-workspace-release-manifest.json",
              "security-supply-chain-readiness.json",
              "agentic-workspace.spdx.json",
              ownership["distribution_identity"]["canonical_install_receipt"],
              ownership["distribution_identity"]["redistributable_receipt"],
              "support-bearing-promotion.json",
          }
          security = manifest.get("security_supply_chain", {})
          if security.get("required") is not True:
              raise SystemExit("Release manifest is missing required security supply-chain readiness")
          for readiness_key in ("distribution_install_readiness", "redistributable_package_readiness"):
              readiness_asset = manifest.get(readiness_key, "")
              readiness_path = dist / readiness_asset
              readiness = json.loads(readiness_path.read_text(encoding="utf-8")) if readiness_path.is_file() else {}
              if readiness.get("status") != "passed" or readiness.get("version") != manifest["version"]:
                  raise SystemExit(f"Release manifest has invalid {readiness_key}: {readiness_asset}")
          semantic = manifest.get("semantic_conformance", {})
          if semantic.get("required") is not True or len(semantic.get("receipts", [])) != len(ownership["semantic_conformance"]["runtime_majors"]):
              raise SystemExit("Release manifest is missing required semantic-conformance receipts")
          required_assets.update(receipt["asset"] for receipt in semantic["receipts"])
          for package in manifest["packages"]:
              if package.get("ecosystem") == "npm":
                  required_assets.add(package["tarball"]["asset"])
              else:
                  required_assets.add(package["wheel"]["asset"])
                  required_assets.add(package["sdist"]["asset"])
          missing = sorted(required_assets - set(checksums))
          if missing:
              raise SystemExit(f"Missing checksums for release assets: {missing}")
          for asset in required_assets:
              digest = hashlib.sha256((dist / asset).read_bytes()).hexdigest()
              if checksums[asset] != digest:
                  raise SystemExit(f"Checksum mismatch for {asset}")
          PY

      - name: Attest exact release subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: .release/releases/${{ env.RELEASE_TAG }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
            dist/generated-command-conformance-node*.json
            dist/SHA256SUMS
            dist/agentic-workspace-release-manifest.json
            dist/distribution-install-readiness.json
            dist/redistributable-package-readiness.json
            dist/security-supply-chain-readiness.json
            dist/support-bearing-promotion.json
            dist/agentic-workspace.spdx.json
          fail_on_unmatched_files: true
