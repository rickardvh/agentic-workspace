name: Release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Recovery only: existing immutable release tag. Leave blank for the next stable release.'
        required: false
        type: string
      qualify_only:
        description: Build and verify without tagging or publication.
        type: boolean
        default: false
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source-version:
    name: Source and version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_required: ${{ steps.resolve.outputs.release_required }}
      build_required: ${{ steps.resolve.outputs.build_required }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      runtimes: ${{ steps.resolve.outputs.runtimes }}
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve or recover one immutable release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          QUALIFY_ONLY: ${{ inputs.qualify_only }}
        run: |-
          args=()
          if [ "$QUALIFY_ONLY" = true ]; then args+=(--qualify-only); fi
          python src/tooling/release/release_lifecycle.py resolve "${args[@]}" --source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-identity
          path: release-identity.json
          if-no-files-found: error
          retention-days: 90
        if: steps.resolve.outputs.identity_reused != 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 90
        if: steps.resolve.outputs.release_required == 'true' && steps.resolve.outputs.build_required == 'false' && steps.resolve.outputs.recovery_reused != 'true'
      - name: Reuse exact source merge admission
        if: steps.resolve.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/support_bearing_promotion.py github-checks --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --output server-promotion-receipt.json
          --wait-seconds 900
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-server-promotion-receipt
          path: server-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
        if: steps.resolve.outputs.build_required == 'true'
  platform-build:
    needs: source-version
    if: ${{ !cancelled() && needs.source-version.result == 'success' && needs.source-version.outputs.build_required == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-version.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Build native platform packages
        run: python src/tooling/release/platform_release.py build --artifact-dir platform-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-${{ matrix.target }}
          path: platform-dist/*
          if-no-files-found: error
    permissions:
      contents: read
    env:
      RELEASE_CLASS: stable
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
  platform-assemble:
    needs:
      - source-version
      - platform-build
    if: ${{ !cancelled() && needs.platform-build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-*
          path: platform-inputs
      - name: Assemble complete platform inventory and universal npm package
        run: python src/tooling/release/platform_release.py assemble --inputs platform-inputs --artifact-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: complete-platform-packages
          path: dist/*
          if-no-files-found: error
    permissions:
      contents: read
    env:
      RELEASE_CLASS: stable
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
  platform-consumer:
    needs:
      - source-version
      - platform-assemble
    if: ${{ !cancelled() && needs.platform-assemble.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-version.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - name: Install exact assembled packages without a compiler
        run: python src/tooling/release/platform_release.py smoke --artifact-dir dist --receipt platform-consumer-${{ matrix.target }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-consumer-${{ matrix.target }}
          path: platform-consumer-${{ matrix.target }}.json
          if-no-files-found: error
    permissions:
      contents: read
    env:
      RELEASE_CLASS: stable
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
  release-runtime-matrix:
    needs:
      - source-version
      - platform-assemble
    if: ${{ !cancelled() && needs.platform-assemble.result == 'success' }}
    name: Release runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-version.outputs.runtimes) }}
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - name: Check the retained artifacts on this runtime
        run: |-
          uv lock --check
          uv sync --locked --all-groups
          uv run python src/tooling/check/check_native_release_topology.py --artifact-dir dist --receipt-out runtime-proof.json --execution-context hosted-ci
      - name: Prove path, subprocess, install, and semantic behavior
        run: |
          cargo build --locked --workspace --bins
          cargo test --locked --workspace
          uv run pytest tests/test_shared_core.py tests/test_v1_contract.py -q
          uv run pytest tests/test_external_integration_boundary.py tests/test_package_identity.py::test_install_survives_into_fresh_second_process -q
          uv run pytest tests/test_native_maintainer_logging.py::test_native_logging_concurrent_append_preserves_valid_sequence tests/test_native_maintainer_logging.py::test_native_logging_concurrent_registration_preserves_existing_identities -q
      - name: Prove source-maintenance adapter conformance
        env:
          AGENTIC_WORKSPACE_CORE_BINARY: ${{ github.workspace }}/target/debug/agentic-workspace-core
        run: uv run python src/tooling/check/check_native_sources.py
      - name: Write runtime support receipt
        shell: bash
        run: |
          mkdir -p runtime-receipts
          python src/tooling/release/support_bearing_promotion.py runtime-receipt \
            --commit "$(git rev-parse HEAD)" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --node "${{ matrix.node }}" \
            --proof "isolated native wheel, npm, paired archive and owner mutation on this runtime" \
            --output "runtime-receipts/${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}.json"
      - name: Upload runtime support receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: runtime-receipts/*.json
          if-no-files-found: error
    permissions:
      contents: read
    env:
      RELEASE_CLASS: stable
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
      AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/dist
  agentic-workspace-package:
    if: ${{ !cancelled() && needs.source-version.outputs.build_required == 'true' && needs.release-runtime-matrix.result == 'success' && needs.platform-consumer.result
      == 'success' && needs.workspace-checks.result == 'success' && needs.planning-handoff-checks.result == 'success' && needs.independent-owner-ingress.result ==
      'success' }}
    needs:
      - source-version
      - release-runtime-matrix
      - platform-consumer
      - workspace-checks
      - planning-handoff-checks
      - independent-owner-ingress
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_CLASS: stable
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Download exact-commit promotion receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-server-promotion-receipt
          path: promotion-inputs/server
      - name: Download declared runtime receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runtime-*
          path: promotion-inputs/runtime
          merge-multiple: true
      - name: Sync workspace dependencies
        run: uv sync --locked --all-groups
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-consumer-*
          path: dist
          merge-multiple: true
      - name: Build Agentic Workspace package artifacts
        run: python src/tooling/release/release_lifecycle.py build
      - name: Run built package smoke tests
        env:
          AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: uv run pytest tests/test_native_release_topology.py -q
      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: dist
          format: spdx-json
          output-file: dist/agentic-workspace.spdx.json
          upload-artifact: false
      - name: Prove exact npm artifacts on Node 24
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node24.json PACKED_ARTIFACT_CONTEXT=hosted-ci
      - name: Set up minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Prove exact npm artifacts on Node 20
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node20.json PACKED_ARTIFACT_CONTEXT=hosted-ci
      - name: Set up current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25'
      - name: Prove exact npm artifacts on Node 25
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node25.json PACKED_ARTIFACT_CONTEXT=hosted-ci
      - name: Check locked Rust advisories, licenses and sources
        run: python src/tooling/check/check_rust_dependencies.py --install
      - name: Compose exact release evidence and manifest
        id: compose
        run: python src/tooling/release/release_lifecycle.py compose --github-output "$GITHUB_OUTPUT"
      - name: Verify staging after build and proof
        run: python src/tooling/release/release_lifecycle.py verify-stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 90
  workspace-checks:
    needs:
      - source-version
      - platform-assemble
    if: ${{ !cancelled() && needs.platform-assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/admission-dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Download the exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: admission-dist
      - name: Admit the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Run native root CLI and thin-launcher admission
        run: uv run pytest tests/test_native_public_cli.py -q
      - name: Preserve real Planning custody through public consumers
        run: uv run pytest tests/test_native_planning_create.py -k "public_creation_then_separate_selection or quiescent_selected_owner" -q
      - name: Admit exact current source reconciliation through public consumers
        run: uv run pytest tests/test_native_source_reconciliation.py -q
      - name: Prove compact operating projection and exact carriage
        run: uv run pytest tests/test_native_operating_carriage.py tests/test_native_invoke_continuation.py -q
      - name: Preserve stronger and fallback decision ownership through public consumers
        run: uv run pytest tests/test_native_repository_decisions.py tests/test_native_memory_capture.py -q
      - name: Preserve owner admission, proof, custody and removal on installed artifacts
        run: uv run pytest tests/test_native_assignment_judgment.py tests/test_native_assignment_policy.py tests/test_native_advisory_config.py tests/test_native_config_admission.py
          tests/test_native_configuration_write.py tests/test_native_execution_configurations.py tests/test_native_instruction_write.py tests/test_native_instruction_verification.py
          tests/test_native_claim_review.py tests/test_native_domain_proof.py tests/test_native_proof_producer.py tests/test_native_verification_strategy.py tests/test_native_planning_lifetime.py
          tests/test_native_memory_disposition.py tests/test_native_resources.py tests/test_native_system_intent.py tests/test_native_transport.py -q
      - name: Run shared operating-decision core proof
        run: |
          cargo build --locked --workspace --bins
          cargo test --locked --workspace
          uv run pytest tests/test_shared_core.py tests/test_v1_contract.py -q
      - name: Run workspace lint
        run: make lint-workspace
      - name: Run workspace typecheck without another sync
        run: make typecheck-nosync
      - name: Run workspace release proof
        run: make verify-workspace
      - name: Verify native source boundaries
        env:
          AGENTIC_WORKSPACE_CORE_BINARY: ${{ github.workspace }}/target/debug/agentic-workspace-core
        run: uv run python src/tooling/check/check_native_sources.py
    permissions:
      contents: read
  planning-handoff-checks:
    needs:
      - source-version
      - platform-assemble
    if: ${{ !cancelled() && needs.platform-assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/admission-dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Download the exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: admission-dist
      - name: Admit the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Preserve Planning handoff continuation through public consumers
        run: uv run pytest tests/test_native_readonly_handoff.py tests/test_native_delegation_lifecycle.py -vv -o faulthandler_timeout=120
    permissions:
      contents: read
  independent-owner-ingress:
    needs:
      - source-version
      - platform-assemble
    if: ${{ !cancelled() && needs.platform-assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-version.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - name: Stamp the pinned release identity
        run: python src/tooling/release/release_lifecycle.py stamp
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Admit the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Verify lock without rewriting it
        run: uv lock --check
      - name: Sync the workspace once
        run: make sync-all
      - name: Prove independently linked native owner admission through public consumers
        run: uv run pytest tests/test_native_independent_owner.py -vv -o faulthandler_timeout=120
    permissions:
      contents: read
  publish-github:
    name: Publish retained GitHub artifacts
    needs:
      - source-version
      - agentic-workspace-package
    if: ${{ !cancelled() && !inputs.qualify_only && needs.source-version.outputs.release_required == 'true' && (needs.agentic-workspace-package.result == 'success'
      || (needs.source-version.outputs.build_required == 'false' && needs.agentic-workspace-package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
      EXPECTED_SOURCE_COMMIT: ${{ needs.source-version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.source-version.outputs.build_required == 'true' && 'verified-release-bundle' || 'recovered-release-bundle' }}
          path: dist
      - name: Verify retained bytes before publication
        run: python src/tooling/release/release_lifecycle.py verify-bundle
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: needs.source-version.outputs.build_required == 'true'
        with:
          subject-path: dist/*
      - name: Reserve source tag and publish missing exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/release_lifecycle.py publish
  language-registries:
    needs:
      - source-version
      - publish-github
    if: ${{ !cancelled() && !inputs.qualify_only && needs.publish-github.result == 'success' }}
    runs-on: ubuntu-latest
    environment: cargo-registry
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Fetch admitted Cargo sources and verify their publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
        run: python src/tooling/release/registry_release.py --fetch --tag "$RELEASE_TAG" --source "$(git rev-parse refs/tags/$RELEASE_TAG^{commit})" --artifact-dir
          dist
      - name: Obtain short-lived crates.io identity after initial bootstrap
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish missing exact versions in paired order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
        run: python src/tooling/release/cargo_release.py publish --tag "$RELEASE_TAG" --artifact-dir dist
      - name: Verify public Cargo sources and isolated paired install
        env:
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
        run: python src/tooling/release/cargo_release.py verify --tag "$RELEASE_TAG" --artifact-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-registry-publication
          path: dist/cargo-registry-publication.json
          if-no-files-found: error
    env:
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
      EXPECTED_SOURCE_COMMIT: ${{ needs.source-version.outputs.source_commit }}
  language-packages:
    needs:
      - source-version
      - publish-github
    if: ${{ !cancelled() && !inputs.qualify_only && needs.publish-github.result == 'success' }}
    runs-on: ubuntu-latest
    environment: package-registries
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable release source independently of recovery tooling
        id: release-source
        env:
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.source-version.outputs.source_commit }}
        run: |
          set -euo pipefail
          release_source=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ -n "$EXPECTED_SOURCE_COMMIT" ] && [ "$release_source" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release tag does not match the requested immutable source" >&2
            exit 1
          fi
          echo "commit=$release_source" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1
      - name: Install uv for the documented Python tool journey
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Fetch and verify admitted GitHub bytes
        env:
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
        run: python src/tooling/release/registry_release.py --fetch --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist
      - name: Reobserve immutable registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
        run: python src/tooling/release/registry_release.py --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist --pending registry-pending >> "$GITHUB_OUTPUT"
      - name: Publish missing exact PyPI artifacts with trusted identity
        if: steps.pending.outputs.python_pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: registry-pending/python/
      - name: Publish missing exact npm artifact with trusted identity
        if: steps.pending.outputs.npm_pending == 'true'
        env:
          NPM_TAG: ${{ steps.pending.outputs.npm_tag }}
        run: npm publish registry-pending/npm/*.tgz --access public --tag "$NPM_TAG" --provenance --ignore-scripts
      - name: Verify public bytes and clean native consumers
        env:
          RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
        run: python src/tooling/release/registry_release.py --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist --verify --receipt registry-publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: language-registry-publication
          path: registry-publication.json
          if-no-files-found: error
    env:
      RELEASE_TAG: ${{ needs.source-version.outputs.tag }}
      EXPECTED_SOURCE_COMMIT: ${{ needs.source-version.outputs.source_commit }}
  verify-destinations:
    name: Verify coordinated completion
    needs:
      - source-version
      - publish-github
      - language-registries
      - language-packages
    if: ${{ !cancelled() && needs.publish-github.result == 'success' && needs.language-registries.result == 'success' && needs.language-packages.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-identity
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.source-version.outputs.build_required == 'true' && 'verified-release-bundle' || 'recovered-release-bundle' }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: language-registry-publication
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-registry-publication
          path: dist
      - name: Retain matching destination receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/release_lifecycle.py complete
    env:
      EXPECTED_SOURCE_COMMIT: ${{ needs.source-version.outputs.source_commit }}
  summary:
    name: Release result
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - source-version
      - agentic-workspace-package
      - publish-github
      - language-registries
      - language-packages
      - verify-destinations
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          QUALIFY_ONLY: ${{ inputs.qualify_only }}
        run: |-
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              for name, result in results.items():
                  report.write(f"- {name}: {result['result']}\n")
              identity = results['source-version']['outputs']
              report.write(f"\nSource: `{identity.get('source_commit', 'unresolved')}`; release: `{identity.get('tag', 'none')}`.\n")
              if any(row['result'] in ('failure', 'cancelled') for row in results.values()):
                  report.write('\nRecovery: Re-run failed jobs for this run. After tagging, a later dispatch may supply that exact tag; it must recover the retained bundle.\n')
                  raise SystemExit(1)
              if os.environ['QUALIFY_ONLY'] == 'true':
                  report.write('\nValidation only; no publication was requested.\n')
          PY
