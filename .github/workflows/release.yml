name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable preview, RC or stable tag to qualify or publish.
        required: true
        type: string
      source_commit:
        description: Commit the tag must resolve to.
        required: true
        type: string
      release_class:
        description: Explicit claim carried by this immutable subject.
        type: choice
        options: [stable, preview, release-candidate]
        default: stable
      qualify_only:
        description: Exercise the exact candidate without publication effects.
        type: boolean
        default: false
      registries_only:
        description: Publish existing admitted GitHub assets to registries without rebuilding them.
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  promotion-admission:
    name: Admit exact release subject
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.admit.outputs.tag }}
      source_commit: ${{ steps.admit.outputs.source_commit }}
      release_class: ${{ steps.admit.outputs.release_class }}
      support_bearing: ${{ steps.admit.outputs.support_bearing }}
      registries: ${{ steps.admit.outputs.registries }}
      platforms: ${{ steps.admit.outputs.platforms }}
      runtimes: ${{ steps.admit.outputs.runtimes }}
      build_required: ${{ steps.admit.outputs.build_required }}
    env:
      RELEASE_CLASS: ${{ inputs.release_class || 'stable' }}
      REGISTRIES_ONLY: ${{ inputs.registries_only }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || '' }}
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve and verify exact source commit checks
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/release_lifecycle.py admit --github-output "$GITHUB_OUTPUT"
      - name: Upload server promotion receipt
        if: steps.admit.outputs.support_bearing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-promotion-receipt
          path: server-promotion-receipt.json
          if-no-files-found: error

  platform-build:
    needs: promotion-admission
    if: needs.promotion-admission.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promotion-admission.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.promotion-admission.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Build native platform packages
        run: python src/tooling/release/platform_release.py build --artifact-dir platform-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-${{ matrix.target }}
          path: platform-dist/*
          if-no-files-found: error
  platform-assemble:
    needs: [promotion-admission, platform-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.promotion-admission.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-*
          path: platform-inputs
      - name: Assemble complete platform inventory and universal npm package
        run: python src/tooling/release/platform_release.py assemble --inputs platform-inputs --artifact-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: complete-platform-packages
          path: dist/*
          if-no-files-found: error
  platform-consumer:
    needs: [promotion-admission, platform-assemble]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promotion-admission.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.promotion-admission.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - name: Install exact assembled packages without a compiler
        run: python src/tooling/release/platform_release.py smoke --artifact-dir dist --receipt platform-consumer-${{ matrix.target }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-consumer-${{ matrix.target }}
          path: platform-consumer-${{ matrix.target }}.json
          if-no-files-found: error

  release-runtime-matrix:
    needs: promotion-admission
    if: needs.promotion-admission.outputs.build_required == 'true'
    name: Release runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promotion-admission.outputs.runtimes) }}
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.promotion-admission.outputs.source_commit }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify lock and runtime-specific behavior
        run: |
          uv lock --check
          uv sync --locked --all-groups
          uv build --wheel --sdist --out-dir runtime-dist
          uv run python src/tooling/release/stage_native_npm.py --output runtime-npm --native-archive-dir runtime-dist
          npm pack ./runtime-npm --pack-destination runtime-dist
          uv run python src/tooling/check/check_native_release_topology.py --artifact-dir runtime-dist --receipt-out runtime-proof.json --execution-context hosted-ci
      - name: Write runtime support receipt
        if: needs.promotion-admission.outputs.support_bearing == 'true'
        shell: bash
        run: |
          mkdir -p runtime-receipts
          python src/tooling/release/support_bearing_promotion.py runtime-receipt \
            --commit "$(git rev-parse HEAD)" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --node "${{ matrix.node }}" \
            --proof "isolated native wheel, npm, paired archive and owner mutation on this runtime" \
            --output "runtime-receipts/${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}.json"
      - name: Upload runtime support receipt
        if: needs.promotion-admission.outputs.support_bearing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: runtime-receipts/*.json
          if-no-files-found: error

  agentic-workspace-package:
    if: needs.promotion-admission.outputs.build_required == 'true'
    needs: [promotion-admission, release-runtime-matrix, platform-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_CLASS: ${{ needs.promotion-admission.outputs.release_class }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.promotion-admission.outputs.source_commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download exact-commit promotion receipts
        if: needs.promotion-admission.outputs.support_bearing == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-server-promotion-receipt
          path: promotion-inputs/server

      - name: Download declared runtime receipts
        if: needs.promotion-admission.outputs.support_bearing == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: promotion-inputs/runtime
          merge-multiple: true

      - name: Sync workspace dependencies
        run: uv sync --locked --all-groups

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-consumer-*
          path: dist
          merge-multiple: true

      - name: Build Agentic Workspace package artifacts
        run: python src/tooling/release/release_lifecycle.py build

      - name: Run built package smoke tests
        env:
          AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: uv run pytest tests/test_native_release_topology.py -q

      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/agentic-workspace.spdx.json
          upload-artifact: false

      - name: Prove exact npm artifacts on Node 24
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node24.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Set up minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Prove exact npm artifacts on Node 20
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node20.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Set up current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - name: Prove exact npm artifacts on Node 25
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node25.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - name: Check locked Rust advisories, licenses and sources
        run: python src/tooling/check/check_rust_dependencies.py --install

      - name: Compose exact release evidence and manifest
        id: compose
        run: python src/tooling/release/release_lifecycle.py compose --github-output "$GITHUB_OUTPUT"

      - name: Reject replacement of existing immutable bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/release_lifecycle.py check-published

      - name: Attest exact release subjects
        if: ${{ !inputs.qualify_only }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub release assets
        if: ${{ !inputs.qualify_only }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.promotion-admission.outputs.support_bearing != 'true' }}
          make_latest: ${{ needs.promotion-admission.outputs.support_bearing == 'true' }}
          overwrite_files: false
          body_path: .release/releases/${{ env.RELEASE_TAG }}.md
          files: ${{ steps.compose.outputs.assets }}
          fail_on_unmatched_files: true

      - name: Smoke published preview from public bytes
        if: ${{ !inputs.qualify_only && needs.promotion-admission.outputs.support_bearing != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/preview_public_smoke.py --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  language-registries:
    needs: [promotion-admission, agentic-workspace-package]
    if: ${{ !cancelled() && !inputs.qualify_only && needs.promotion-admission.outputs.registries == 'true' && needs.promotion-admission.result == 'success' && (needs.agentic-workspace-package.result == 'success' || (needs.promotion-admission.outputs.build_required == 'false' && needs.agentic-workspace-package.result == 'skipped')) }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/registry-release.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  # PyPI trusts the top-level workflow; publishing from workflow_call is unsupported.
  language-packages:
    needs: [promotion-admission, agentic-workspace-package]
    if: ${{ !cancelled() && !inputs.qualify_only && needs.promotion-admission.outputs.registries == 'true' && needs.promotion-admission.result == 'success' && (needs.agentic-workspace-package.result == 'success' || (needs.promotion-admission.outputs.build_required == 'false' && needs.agentic-workspace-package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: package-registries
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.registries_only && 'master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable release source independently of recovery tooling
        id: release-source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          release_source=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ -n "$EXPECTED_SOURCE_COMMIT" ] && [ "$release_source" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Release tag does not match the requested immutable source" >&2
            exit 1
          fi
          echo "commit=$release_source" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1
      - name: Install uv for the documented Python tool journey
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Fetch and verify admitted GitHub bytes
        env:
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: python src/tooling/release/registry_release.py --fetch --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist
      - name: Reobserve immutable registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
        run: python src/tooling/release/registry_release.py --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist --pending registry-pending >> "$GITHUB_OUTPUT"
      - name: Publish missing exact PyPI artifacts with trusted identity
        if: steps.pending.outputs.python_pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: registry-pending/python/
      - name: Publish missing exact npm artifact with trusted identity
        if: steps.pending.outputs.npm_pending == 'true'
        env:
          NPM_TAG: ${{ steps.pending.outputs.npm_tag }}
        run: npm publish registry-pending/npm/*.tgz --access public --tag "$NPM_TAG" --provenance --ignore-scripts
      - name: Verify public bytes and clean native consumers
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          RELEASE_SOURCE: ${{ steps.release-source.outputs.commit }}
        run: python src/tooling/release/registry_release.py --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --artifact-dir dist --verify --receipt registry-publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-registry-publication
          path: registry-publication.json
          if-no-files-found: error
