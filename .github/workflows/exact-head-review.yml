name: Review approval

on:
  workflow_run:
    workflows: [CI, Review event]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]

# Both triggers load this definition from the default branch. Admission of this
# file there is required before publication works; a candidate copy is not an
# authority bootstrap. Review event is only an untrusted wake-up signal.

permissions:
  contents: read

concurrency:
  group: review-approval-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-authority:
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0]) ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    permissions:
      contents: read
    # Environment must allow only the trusted default branch, with no tag/PR
    # deployment rules. Keep the private key here, never in repository secrets.
    environment: review-publisher
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted merge-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Independently accepted C53 source (#3207). The frozen default
          # branch lacks this publisher; never execute candidate PR code with
          # publisher authority. Advance only to independently admitted source.
          ref: 472e94b85d9ec1a8d5e0da0e63d13ee1621eb558
          fetch-depth: 0
          persist-credentials: false
      - name: Create dedicated publisher token
        id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.REVIEW_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.REVIEW_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Publish review authority
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: >-
          python scripts/github/review_merge_gate.py
          --event "${GITHUB_EVENT_PATH}"
          --repository "${GITHUB_REPOSITORY}"
