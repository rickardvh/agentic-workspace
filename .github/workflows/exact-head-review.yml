name: Review approval

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-approval-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-authority:
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0]) ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted merge-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Publish review authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/github/review_merge_gate.py
          --event "${GITHUB_EVENT_PATH}"
          --repository "${GITHUB_REPOSITORY}"
