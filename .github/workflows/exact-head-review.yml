name: Review approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

concurrency:
  group: review-approval-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-authority:
    if: >-
      ${{ (github.event.workflow_run.pull_requests[0].number) ||
          (github.event.issue.pull_request) || github.event.pull_request }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working review gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This revision contains the configured reviewer-App provenance fix.
          # Frozen master lacks the gate. No new publisher credentials are needed.
          ref: b21a62a5c185a1cebb5f161a64dd627811e19124
          fetch-depth: 0
          persist-credentials: false
      - name: Publish current review status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/github/review_merge_gate.py
          --event "${GITHUB_EVENT_PATH}"
          --repository "${GITHUB_REPOSITORY}"
