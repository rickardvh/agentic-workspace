name: Maintenance

on:
  schedule:
    - cron: '23 7 * * *'
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Exact public version (empty freezes latest admitted stable once)
        type: string
      previous:
        description: Exact previous public version (empty selects earlier published stable)
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-install-projection:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 7 * * *' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Surface accepted public projection follow-up
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/tooling/release/current_install.py --observe

  security:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  freeze:
    if: github.event.schedule != '17 4 * * 1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - id: freeze
        env:
          PUBLIC_VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous }}
        shell: bash
        run: |
          args=()
          if [ -n "$PUBLIC_VERSION" ]; then args+=(--version "${PUBLIC_VERSION#v}"); fi
          if [ -n "$PREVIOUS_VERSION" ]; then args+=(--previous "$PREVIOUS_VERSION"); fi
          python src/tooling/model-cli-harness/consumer_schedule.py freeze --directory frozen --deterministic-only "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-frozen-subjects
          path: frozen/
          retention-days: 7
          if-no-files-found: error

  deterministic:
    needs: freeze
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.freeze.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: consumer-frozen-subjects
          path: frozen
      - name: Run selected exact public consumer
        env:
          CASE_ID: ${{ matrix.id }}
        run: python src/tooling/model-cli-harness/consumer_schedule.py run --directory frozen --output results --scratch scratch --kind deterministic --case-id "${{ matrix.id }}"
      - name: Clean only this run's recorded disposable resources
        if: always()
        run: python src/tooling/model-cli-harness/consumer_schedule.py cleanup --directory frozen --scratch scratch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-result-${{ matrix.id }}
          path: results/*.json
          retention-days: 7
          if-no-files-found: error

  report:
    if: always() && needs.freeze.result == 'success'
    needs: [freeze, deterministic]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: consumer-frozen-subjects
          path: frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: consumer-result-*
          path: results
      - name: Summarize all assigned cases, including failures and missing execution
        run: python src/tooling/model-cli-harness/consumer_schedule.py summary --directory frozen --output results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-summary
          path: results/summary.json
          retention-days: 7
          if-no-files-found: error
