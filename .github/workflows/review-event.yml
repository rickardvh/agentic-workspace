name: Review event

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

# This definition may come from a PR merge ref. It has no publisher credential,
# checkout, artifacts, or verdict. The default-branch publisher re-reads reviews
# and the current PR head from GitHub after this workflow completes.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify trusted publisher
        run: echo 'Review state changed; the trusted publisher must reobserve it.'
