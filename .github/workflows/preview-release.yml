name: Preview and Release Candidate

on:
  # Register the publisher from the accepted default branch. This event cannot admit or publish a preview.
  push:
    branches: [master]
    paths: [.github/workflows/preview-release.yml]
  workflow_dispatch:
    inputs:
      preview_tag:
        description: Existing immutable preview-vX.Y.Z or v1.0.0-rc.N tag
        required: true
        type: string
      artifact_commit:
        description: Exact artifact commit SHA bound to the tag
        required: true
        type: string

concurrency:
  group: preview-${{ inputs.preview_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview-registration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview publisher registered; publication requires explicit dispatch."

  preview-admission:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.admit.outputs.tag }}
      artifact_commit: ${{ steps.admit.outputs.artifact_commit }}
    steps:
      - name: Checkout trusted dispatch authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Admit tag as data with the trusted verifier
        id: admit
        env:
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
        run: python scripts/release/preview_release.py --admit-tag "$PREVIEW_TAG" --artifact-commit "$ARTIFACT_COMMIT" >> "$GITHUB_OUTPUT"

  platform-packages:
    needs: preview-admission
    uses: ./.github/workflows/platform-release.yml
    with:
      source_ref: ${{ needs.preview-admission.outputs.artifact_commit }}

  preview-runtime-matrix:
    needs: preview-admission
    name: Preview runtime ${{ matrix.os }} / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "20"
          - os: ubuntu-latest
            python: "3.13"
            node: "24"
          - os: ubuntu-latest
            python: "3.14"
            node: "24"
    steps:
      - name: Checkout exact preview subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preview-admission.outputs.artifact_commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify lock and runtime-specific behavior
        run: |
          uv lock --check
          uv sync --locked --all-groups
          uv build --wheel --sdist --out-dir runtime-dist
          uv run python scripts/release/stage_native_npm.py --output runtime-npm --native-archive-dir runtime-dist
          npm pack ./runtime-npm --pack-destination runtime-dist
          uv run python scripts/check/check_native_release_topology.py --artifact-dir runtime-dist --receipt-out runtime-proof.json --execution-context hosted-ci

  preview-package:
    needs: [preview-admission, preview-runtime-matrix, platform-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.preview-admission.outputs.tag }}
    steps:
      - name: Checkout exact preview subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preview-admission.outputs.artifact_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify exact preview identity and reconstruction source
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/master:refs/remotes/origin/master" --tags
          TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "Preview tag ${RELEASE_TAG} resolves to ${TAG_COMMIT}, checkout is ${HEAD_COMMIT}" >&2
            exit 1
          fi
          python scripts/release/coordinated_release.py verify-preview --tag "${RELEASE_TAG}" > preview-subject.json
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("preview-subject.json", encoding="utf-8"))["reconstruction_source_commit"])')"
          if ! git merge-base --is-ancestor "${SOURCE_COMMIT}" refs/remotes/origin/master; then
            echo "Preview source ${SOURCE_COMMIT} is not reachable from master" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD^)" != "${SOURCE_COMMIT}" ]; then
            echo "Preview artifact commit must have the exact reconstruction source as its single parent" >&2
            exit 1
          fi
          test ! -e support-bearing-promotion.json

      - name: Inspect existing immutable preview release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/preview_release.py --check-published "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - if: steps.existing.outputs.complete != 'true'
        name: Sync exact preview dependency graph
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - if: steps.existing.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: complete-platform-packages
          path: dist
      - if: steps.existing.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-consumer-*
          path: dist
          merge-multiple: true

      - if: steps.existing.outputs.complete != 'true'
        name: Build coordinated preview package artifacts
        run: |
          python scripts/release/platform_release.py verify --artifact-dir dist
          python scripts/release/cargo_release.py build --artifact-dir dist --staging "$RUNNER_TEMP/aw-cargo"
          python scripts/release/cargo_release.py install-staged --artifact-dir dist --staging "$RUNNER_TEMP/aw-cargo"
          uv run python scripts/check/check_package_identity.py \
            --artifact-dir dist \
            --require-exact-urls

      - if: steps.existing.outputs.complete != 'true'
        name: Run built preview package smoke tests
        env:
          AW_NATIVE_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: uv run pytest tests/test_native_release_topology.py -q

      - if: steps.existing.outputs.complete != 'true'
        name: Generate preview SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/agentic-workspace.spdx.json
          upload-artifact: false

      - if: steps.existing.outputs.complete != 'true'
        name: Prove exact preview npm artifacts on Node 24
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node24.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - if: steps.existing.outputs.complete != 'true'
        name: Set up minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - if: steps.existing.outputs.complete != 'true'
        name: Prove exact preview npm artifacts on Node 20
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node20.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - if: steps.existing.outputs.complete != 'true'
        name: Set up current Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - if: steps.existing.outputs.complete != 'true'
        name: Prove exact preview npm artifacts on Node 25
        run: make packed-artifact-conformance PACKED_ARTIFACT_DIR=dist PACKED_ARTIFACT_RECEIPT=dist/generated-command-conformance-node25.json PACKED_ARTIFACT_CONTEXT=hosted-ci

      - if: steps.existing.outputs.complete != 'true'
        name: Verify semantic-conformance receipts
        run: |
          for runtime_major in 20 24 25; do
            receipt="dist/generated-command-conformance-node${runtime_major}.json"
            uv run python scripts/check/check_native_release_topology.py --verify-receipt "$receipt" --artifact-dir dist --expected-node-major "$runtime_major" --expected-execution-context hosted-ci
          done

      - if: steps.existing.outputs.complete != 'true'
        name: Generate preview security readiness
        run: |
          python scripts/check/check_rust_dependencies.py --install
          uv run python scripts/check/check_security_supply_chain.py --format json --source-identity "$(git rev-parse HEAD)" --artifact-dir dist --output dist/security-supply-chain-readiness.json

      - if: steps.existing.outputs.complete != 'true'
        name: Compose non-support-bearing preview manifest and checksums
        run: |
          python scripts/release/preview_manifest.py --tag "${RELEASE_TAG}" --artifact-dir dist > preview-manifest-result.json
          test -f dist/agentic-workspace-preview-release-manifest.json
          test -f dist/SHA256SUMS
          test ! -e dist/support-bearing-promotion.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/agentic-workspace-preview-release-manifest.json").read_text(encoding="utf-8"))
          assert manifest["release_class"] in {"preview", "release-candidate"}
          assert manifest["support_bearing"] is False
          assert manifest["support_bearing_promotion"]["required"] is False
          assert manifest["artifact_commit"] != manifest["reconstruction_source_commit"]
          PY

      - if: steps.existing.outputs.complete != 'true'
        name: Bind all platform artifacts and compiler-free consumers
        run: python scripts/release/platform_release.py extend --artifact-dir dist --tag "${RELEASE_TAG}"

      - if: steps.existing.outputs.complete != 'true'
        name: Reject replacement of existing preview bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/preview_release.py --check-published "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --artifact-dir dist

      - if: steps.existing.outputs.complete != 'true'
        name: Attest exact preview subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - if: steps.existing.outputs.complete != 'true'
        name: Publish GitHub prerelease assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Prerelease ${{ env.RELEASE_TAG }}
          prerelease: true
          overwrite_files: false
          make_latest: false
          body_path: .release/releases/${{ env.RELEASE_TAG }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
            dist/*.crate
            dist/cargo-release-manifest.json
            dist/agentic-workspace-native-*.zip
            dist/generated-command-conformance-node*.json
            dist/platform-release-manifest.json
            dist/platform-consumer-*.json
            dist/SHA256SUMS
            dist/agentic-workspace-preview-release-manifest.json
            dist/distribution-install-readiness.json
            dist/redistributable-package-readiness.json
            dist/security-supply-chain-readiness.json
            dist/agentic-workspace.spdx.json
          fail_on_unmatched_files: true

      - name: Smoke published preview from public bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release/preview_public_smoke.py --tag "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" | tee preview-public-smoke.json
          {
            echo "### Published preview smoke"
            echo '```json'
            cat preview-public-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  language-registries:
    needs: [preview-admission, preview-package]
    if: startsWith(needs.preview-admission.outputs.tag, 'v1.0.0-rc.')
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/registry-release.yml
    with:
      tag: ${{ needs.preview-admission.outputs.tag }}

  # PyPI trusts the top-level workflow; publishing from workflow_call is unsupported.
  language-packages:
    needs: [preview-admission, preview-package]
    if: startsWith(needs.preview-admission.outputs.tag, 'v1.0.0-rc.')
    runs-on: ubuntu-latest
    environment: package-registries
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preview-admission.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1
      - name: Fetch and verify admitted GitHub bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preview-admission.outputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          publisher=release.yml
          if [[ "$RELEASE_TAG" == v1.0.0-rc.* ]]; then publisher=preview-release.yml; fi
          for artifact in dist/*.whl dist/*.tar.gz dist/*.tgz dist/*release-manifest.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$publisher"
          done
      - name: Reobserve immutable registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ needs.preview-admission.outputs.tag }}
        run: python scripts/release/registry_release.py --tag "$RELEASE_TAG" --source "$(git rev-parse HEAD)" --artifact-dir dist --pending registry-pending >> "$GITHUB_OUTPUT"
      - name: Publish missing exact PyPI artifacts with trusted identity
        if: steps.pending.outputs.python_pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: registry-pending/python/
      - name: Publish missing exact npm artifact with trusted identity
        if: steps.pending.outputs.npm_pending == 'true'
        env:
          NPM_TAG: ${{ steps.pending.outputs.npm_tag }}
        run: npm publish registry-pending/npm/*.tgz --access public --tag "$NPM_TAG" --provenance --ignore-scripts
      - name: Verify public bytes and clean native consumers
        env:
          RELEASE_TAG: ${{ needs.preview-admission.outputs.tag }}
        run: python scripts/release/registry_release.py --tag "$RELEASE_TAG" --source "$(git rev-parse HEAD)" --artifact-dir dist --verify --receipt registry-publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-registry-publication
          path: registry-publication.json
          if-no-files-found: error
