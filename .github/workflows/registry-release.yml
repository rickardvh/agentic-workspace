name: Publish admitted registry artifacts

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: language-registries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: package-registries
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1
      - name: Fetch and verify admitted GitHub bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          publisher=release.yml
          if [[ "$RELEASE_TAG" == v1.0.0-rc.* ]]; then publisher=preview-release.yml; fi
          for artifact in dist/*.whl dist/*.tar.gz dist/*.tgz dist/*release-manifest.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$publisher"
          done
      - name: Reobserve immutable registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release/registry_release.py --tag "$RELEASE_TAG" --source "$(git rev-parse HEAD)" --artifact-dir dist --pending registry-pending >> "$GITHUB_OUTPUT"
      - name: Publish missing exact PyPI artifacts with trusted identity
        if: steps.pending.outputs.python_pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: registry-pending/python/
      - name: Publish missing exact npm artifact with trusted identity
        if: steps.pending.outputs.npm_pending == 'true'
        env:
          NPM_TAG: ${{ steps.pending.outputs.npm_tag }}
        run: npm publish registry-pending/npm/*.tgz --access public --tag "$NPM_TAG" --provenance --ignore-scripts
      - name: Verify public bytes and clean native consumers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release/registry_release.py --tag "$RELEASE_TAG" --source "$(git rev-parse HEAD)" --artifact-dir dist --verify --receipt registry-publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-registry-publication
          path: registry-publication.json
          if-no-files-found: error

  cargo-publish:
    runs-on: ubuntu-latest
    environment: cargo-registry
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch admitted Cargo sources and verify their publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          publisher=release.yml
          if [[ "$RELEASE_TAG" == v1.0.0-rc.* ]]; then publisher=preview-release.yml; fi
          for artifact in dist/*.crate dist/cargo-release-manifest.json dist/*release-manifest.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$publisher"
          done
      - name: Reconstruct packaging for byte comparison before credentials
        run: |
          cargo fetch --locked
          python scripts/release/cargo_release.py build --no-verify --artifact-dir reconstructed --staging "$RUNNER_TEMP/aw-cargo"
      - name: Obtain short-lived crates.io identity after initial bootstrap
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish missing exact versions in paired order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release/cargo_release.py publish --tag "$RELEASE_TAG" --artifact-dir dist --staging "$RUNNER_TEMP/aw-cargo"
      - name: Verify public Cargo sources and isolated paired install
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release/cargo_release.py verify --tag "$RELEASE_TAG" --artifact-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-registry-publication
          path: dist/cargo-registry-publication.json
          if-no-files-found: error
