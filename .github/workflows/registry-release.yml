name: Publish admitted registry artifacts

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: language-registries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  cargo-publish:
    runs-on: ubuntu-latest
    environment: cargo-registry
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch admitted Cargo sources and verify their publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          publisher=release.yml
          if [[ "$RELEASE_TAG" == v1.0.0-rc.* ]]; then publisher=preview-release.yml; fi
          for artifact in dist/*.crate dist/cargo-release-manifest.json dist/*release-manifest.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/$publisher"
          done
      - name: Reconstruct packaging for byte comparison before credentials
        run: |
          cargo fetch --locked
          python src/tooling/release/cargo_release.py build --no-verify --artifact-dir reconstructed --staging "$RUNNER_TEMP/aw-cargo"
      - name: Obtain short-lived crates.io identity after initial bootstrap
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish missing exact versions in paired order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python src/tooling/release/cargo_release.py publish --tag "$RELEASE_TAG" --artifact-dir dist --staging "$RUNNER_TEMP/aw-cargo"
      - name: Verify public Cargo sources and isolated paired install
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python src/tooling/release/cargo_release.py verify --tag "$RELEASE_TAG" --artifact-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-registry-publication
          path: dist/cargo-registry-publication.json
          if-no-files-found: error
