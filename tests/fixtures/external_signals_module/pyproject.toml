[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aw-external-signals-fixture"
version = "1.0.0"
description = "Out-of-tree Agentic Workspace module conformance fixture"
requires-python = ">=3.11"

[project.entry-points."agentic_workspace.modules"]
external-signals = "external_signals:provider"
external-signals-conflict = "external_signals:conflicting_provider"
external-signals-future = "external_signals:future_provider"

[tool.hatch.build.targets.wheel]
packages = ["src/external_signals"]
