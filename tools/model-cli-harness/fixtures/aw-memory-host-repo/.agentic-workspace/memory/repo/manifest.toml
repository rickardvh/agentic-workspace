[rules]
routing_only = [".agentic-workspace/memory/repo/index.md"]
high_level = [".agentic-workspace/memory/repo/index.md"]
canonical_dirs = [".agentic-workspace/memory/repo"]
task_board_globs = []
core_doc_globs = ["README.md"]
core_doc_exclude_globs = [".agentic-workspace/memory/repo/**/*.md"]
forbid_core_docs_depend_on_memory = false

[notes.".agentic-workspace/memory/repo/index.md"]
note_type = "routing"
canonical_home = ".agentic-workspace/memory/repo/index.md"
authority = "canonical"
audience = "human+agent"
canonicality = "agent_only"
task_relevance = "required"
subsystems = ["memory-system"]
surfaces = []
routes_from = [".agentic-workspace/memory/repo/**/*.md"]
stale_when = [".agentic-workspace/memory/repo/**/*.md"]
routing_only = true
high_level = true

[notes.".agentic-workspace/memory/repo/testing-and-packaging.md"]
note_type = "runbook"
canonical_home = ".agentic-workspace/memory/repo/testing-and-packaging.md"
authority = "canonical"
audience = "human+agent"
canonicality = "agent_only"
task_relevance = "required"
subsystems = ["tests", "packaging"]
surfaces = ["tests"]
routes_from = ["README.md", "pyproject.toml", "tests/**/*.py"]
stale_when = ["pyproject.toml", "uv.lock"]

[notes.".agentic-workspace/memory/repo/planning-boundaries.md"]
note_type = "invariant"
canonical_home = ".agentic-workspace/memory/repo/planning-boundaries.md"
authority = "canonical"
audience = "human+agent"
canonicality = "agent_only"
task_relevance = "optional"
subsystems = ["planning"]
surfaces = ["planning"]
routes_from = [".agentic-workspace/planning/**/*.json", ".agentic-workspace/planning/state.toml"]
stale_when = []
